- aid: tui-group:tui-newskies-pricefile-api
  name: TUI New Skies PriceFile API
  description: >-
    Bulk fare-file distribution. Four GET operations — /download/{filename}, /download/{filename}/timestamp,
    /download/delta and /download/delta/timestamp — return base64-encoded ZIP archives of CSV price
    files regenerated approximately every 15 minutes. Each API key is mapped by TUI to a specific
    pricefile; without that mapping every call fails. This is the closest thing TUI publishes to a
    bulk data feed, and it is outbound fare content, not a customer data export.
