- aid: tui-group:tui-supply
  name: TUI Supply v1.5.1
  description: >-
    Bulk package supply feed for OTAs, delivered as XML files placed on a TUI server for SFTP
    download rather than over HTTP. The message is a TUI custom version 1.5.1 built on the TUI XML
    Supply standard combined with the G7 standard, carrying ProductInfo, SupplyTransportInfo,
    SupplyAccoInfo and SupplyPriceAvailabilityInfo per package, including a CommissionGroup with
    commission categories by travel and booking period. Two workflows are documented — full daily
    loads and intraday delta loads — and TUI states each OTA must eventually switch to delta because
    full loads will be switched off.
  humanURL: https://developer.tui/api-catalog/supply
  baseURL: sftp://prod.sftp.tui-b2bota-g7.nl
