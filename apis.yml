- aid: tui-group:tui-b2bota-g7-travelmessage
  name: TUI TravelMessage G7 v3.1 API
  description: >-
    TUI's B2B tour-operator booking interface for travel agents, implementing the Dutch ANVR G7
    standard "standard for ANVR XML-message flow" at TravelMessage version 3.1. Documented dialogues
    are Availability, Sell, Assign, Book, AddProAvailability, Break, Receipt and Recap, operated as a
    session-based XML flow. Every request must carry an anvrcode header containing the agent's
    four-digit ANVR code. TUI states plainly that it altered the published 3.1 XSD to fit its own
    needs, and that several standard dialogues and approaches are not implemented at TUI.
