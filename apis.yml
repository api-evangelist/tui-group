- aid: tui-group:tui-flight-ndc-gateway
  name: TUI Flight NDC Gateway (Navitaire)
  description: >-
    TUI's single point of access for IATA New Distribution Capability traffic, routing NDC 21.3
    Shopping, Selling and Servicing messages through to Navitaire. Published operations are
    AirShopping, OfferPrice, OrderCreate, ServiceList, SeatAvailability, OrderChange, OrderRetrieve,
    OrderReshop, OrderQuote and AirlineProfile, plus an Auth call that exchanges New Skies agent
    credentials for a JWT. Two version families are exposed per operation — /r3.x/v21.3 against the
    Navitaire NDC API and /r3.x/v2 against the Navitaire Digital API. Requires an API key, a New
    Skies agent, a workflow validation and a production IP whitelist.
