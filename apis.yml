- aid: tui-group:tui-newskies-payment-api
  name: TUI New Skies Payment API
  description: >-
    PCI-DSS scoped payment proxy in front of Navitaire New Skies, exposing three channels: REST
    Digital API payments under /rest/api/nsk/{version}/booking/payments (create, retrieve, delete,
    voucher, DCC/MCC, 3-D Secure, refunds, reversals, fees, stored payment methods), a legacy SOAP
    1.1 endpoint at /soap supporting AddPaymentToBooking, and an /ndc endpoint that is reserved for
    future IATA NDC payment support and currently returns 501 Not Implemented. Authenticated with an
    API key passed as an apikey query parameter. No base URL is published on the portal.
