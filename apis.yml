aid: tui-group
url: https://raw.githubusercontent.com/api-evangelist/tui-group/refs/heads/main/apis.yml
name: TUI Group
kind: company
description: >-
  TUI Group is the world's largest integrated leisure tourism business — a vertically integrated
  tour operator that owns the hotels, the cruise ships, the airlines and the retail brands it sells
  through, serving 34.7 million customers a year across tour operators in 18 countries. The United
  Kingdom is its largest single source market: TUI UK & Ireland and the UK-registered carrier TUI
  Airways sit at the centre of the group, alongside Marella Cruises, TUI Musement and the TUI Blue,
  Robinson and TUI Magic Life hotel brands. The group is domiciled in Hannover, Germany and listed
  on the Frankfurt MDAX, having ended its London primary listing in 2023. TUI sits at the supply end
  of the travel distribution chain rather than the intermediation end — it is the principal that
  creates package holidays, not a GDS or a channel manager — and it distributes chiefly through its
  own retail estate and websites, supplemented by B2B feeds to travel agents, OTAs and metasearch
  partners. On the API front TUI runs a real, publicly readable developer portal at developer.tui
  fronted by Apigee X, with 21 documented API products covering flight shopping and booking,
  departure control, packages, accommodation content, cruise and metasearch distribution. The
  documentation is genuinely open — base URLs, endpoints, auth flows, quota tiers, downloadable
  Postman collections and a public OpenAPI 3.0 document for every one of the 21 products (1,261
  operations in total, served from the portal's Swagger UI) are all published without a login — but
  the runtime is not: every API product requires a partner-manager approval, most airline APIs
  additionally require a Navitaire New Skies agent profile and a production IP whitelist, and the
  TUI fly OTA API states plainly that step one is to conclude a contract. There is no self-serve
  key, no published developer terms of use (the portal's terms page is still unfilled lorem-ipsum
  placeholder text), no idempotency contract on any booking or payment operation, no status page,
  no event or webhook surface, and no documented bulk-export or data-portability operation for a
  departing partner.
imageNote: >-
  The `image` property was removed on 2026-08-26. It had been copied verbatim out of a
  bootstrap template and pointed at an icon belonging to groq, not to this company.
  That asset returns HTTP 200, so the record rendered another company's brand
  rather than a broken image, which is why it went unreported (roadmap#153).
  No correct icon has been sourced yet. Shipping the wrong company's mark is worse
  than shipping none; re-run the icon backfill once a real asset exists.
tags:
- Travel
- United Kingdom
- Aviation
- Airline
- Tour Operator
- Distribution
- NDC
- Hospitality
- Hotels
- Cruise
- Booking
- Packages
- Metasearch
