overlay: 1.0.0
info:
  title: API Evangelist enhancements for NSKCC Availability Search API
  version: 1.0.0
extends: openapi/tui-group-tui-flight-availability-search-api-openapi.yml
actions:
- target: $.info
  update:
    x-apievangelist-provider: tui-group
    x-apievangelist-aid: tui-group:tui-flight-availability-search-api
    x-apievangelist-harvested: '2026-07-28'
    x-apievangelist-source: https://developer.tui/api-catalog/nskcc-availability-search-api
    x-apievangelist-access: partner approval required; playground subscription is usually self-serve,
      production needs partner-manager approval
    x-apievangelist-authentication: authentication/tui-group-authentication.yml
    x-apievangelist-conventions: conventions/tui-group-conventions.yml
    x-apievangelist-errors: errors/tui-group-problem-types.yml
    x-apievangelist-lifecycle: lifecycle/tui-group-lifecycle.yml
    x-apievangelist-rate-limits: rate-limits/tui-group-rate-limits.yml
- target: $
  description: The published document declares no servers[]; TUI documents the host pattern https://{env}.api.tui/{API_NAME}
    at https://developer.tui/docs/getting-started_environments.
  update:
    servers:
    - url: https://prod.api.tui
      description: production (TUI Apigee X gateway)
    - url: https://playground.api.tui
      description: playground
