      - version: Patch 9
        date: '2024-12-01'
        note: Two entries are both numbered "Patch 9" on TUI's page; recorded as published.
        additions:
          - Board types LD (logies diner) and UA (Ultra All Inclusive) added to the XSD and the API specification.
      - version: Patch 8
        date: '2024-08-08'
        additions:
          - Optional OccupancyRestrictions group added to the XSD and the OpenAPI specification.
      - version: Patch 7
        date: '2024-04-10'
        breaking:
          - >-
            For packages deleted in the delta flow the ProductInfo group is no longer sent;
            mutation type "deletion" plus PackageID is now sufficient. ProductInfo became
            non-mandatory in the XSD.
      - version: Patch 5
        date: '2024-04-10'
        additions:
          - Tripduration added (optional; duration in days from local departure to arrival back at origin).
      - version: Patch 4
        date: '2024-02-20'
        breaking:
          - Facility codes 80, 81 and 82 removed.
        additions:
          - CommissionGroup example added to the description page.
      - version: Patch 3
        date: '2023-09-06'
        breaking:
          - >-
            Commission moved into a CommissionGroup structure keyed on travel period and booking
            period, and is no longer carried as a facility. The group is not mandatory, so an XSD
            check will not catch a consumer that missed the change.
      - version: Patch 2
        date: '2023-06-01'
        additions:
          - UnitContentID added to SupplyUnitInfo so the JSON content API can be matched to a supply unit.
      - version: Patch 1
        date: '2023-01-01'
        additions:
          - Initial setup.
  - api: tui-group:tui-flight-availability-search-api
    name: NSKCC Availability Search API
    url: https://developer.tui/api-catalog/nskcc-availability-search-api/release-notes
    last_updated: '2026-04-17'
    current: 2.0.0
    quality: rich
    entries:
      - version: 2.0.0
        date: '2026-03'
        breaking:
          - 'Not backward compatible with v1. Base path /availability → /flight/newskies/availability/v2.'
          - OAuth 2.0 now required.
          - Response results are grouped rather than a flat array.
          - 'Parameters renamed: passengerCount → PassengerCount, groupBy → GroupBy, limitGroups → LimitGroups.'
          - Date format strictly enforced as yyyy-MM-dd.
          - Trip type is now an integer enum (0 = Oneway, 1 = RoundTrip).
        additions:
          - Complete rewrite on .NET 8.0, migrated from AWS Lambda to ECS Fargate.
          - Date-range search for outbound and inbound, multi-airport and country-level search, carrier filtering.
          - Result grouping by origin-destination or date; LimitGroups and LimitFlights parameters.
          - Gross/net fare detail with separate pricing for adults, children and infants; encrypted journey and fare keys; up to two stopovers.
          - Health check at /health; OpenAPI/Swagger documentation published.
