generated: '2026-07-28'
method: searched
source: https://developer.tui/api-catalog/*/release-notes
description: >-
  TUI has no provider-wide changelog. Change communication happens on a per-product "RELEASE NOTES"
  tab on developer.tui, present on 8 of the 21 published API products. Each page carries a
  "Last updated" date and a "Recent changes" line that leaks the underlying GitLab merge-request
  subject from TUI's internal api-program/apigee monorepo — an unusual amount of engineering
  transparency for a tour operator. Quality varies from a genuinely useful numbered patch log (the
  ANVR G7 TravelMessage channel, going back to 2023 with explicit behavioural changes and their
  effects on each dialogue) to unfilled lorem-ipsum placeholder text (HolidayOffersController). The
  live pages are the source of truth; this artifact captures the recent window as read on
  2026-07-28.
scheme: per-product, numbered patch releases with calendar dates (no semantic version train)
provider_wide_changelog: false
rss: false
feeds: []
products:
  - api: tui-group:tui-b2bota-g7-travelmessage
    name: TravelMessage.v31 (ANVR G7)
    url: https://developer.tui/api-catalog/b2bota-g7/release-notes
    last_updated: '2026-07-21'
    current: '3.1 patch 20'
    quality: rich
    entries:
      - version: Patch 20
        date: '2026-07-23'
        planned: true
        additions:
          - Availability — RecomPrice added to the AdditionalProducts response, giving the recommended retail price directly (preferred over the textual PriceNotes).
          - Recap — transport locations (airport names) now included in the TravelMessage travel overview.
          - Supply processing — ArrivalDate on the accommodation is now processed and passed through from supply data.
      - version: Patch 19
        date: '2026-04-22'
        breaking:
          - >-
            Infant age is now calculated from the return flight departure date rather than the
            outbound departure date. A child turning 2 during the trip must now be booked as a
            child for the whole booking.
        additions:
          - Several security patches.
      - version: Patch 18
        date: null
        note: Middleware deployed, awaiting backend deployment.
        breaking:
          - >-
            Transfers move from being auto-added as an "Extra" to being explicitly selected during
            the book flow; default becomes OPT_OUT. Options OPT_OUT / SHARED / PRIVATE, carried at
            Transport level, must be added in Receipt, Sell, Assign and Book, and appear in
            Availability and Recap responses. In Recap they move from "Extra" to "TransportExtras".
      - version: Patch 17
        date: '2025-12-10'
        breaking:
          - Bookings are now capped at nine passengers; more returns ANVR message 1028. Affects Availability, AddProAvailability, Receipt and Sell.
        additions:
          - RequiredSeats implemented on AddProAvailability.
      - version: Patch 16
        date: '2025-10-02'
        additions:
          - Two new luggage codes for extra items — PBAG (personal item, under seat) and HBAG (small trolley / cabin bag). Where neither is used, BG00 is interpreted as HBAG.
      - version: Patch 15
        date: '2025-04-03'
        additions:
          - Supply full and delta delivery dates changed; first delta 30 minutes later.
      - version: Patch 14
        date: '2025-04-15'
        additions:
          - Extra cancellation information where a carrier has differing cancellation policies (Class Group in Transport), in AddProAvailability, Sell and RecapResponse.
      - version: Patch 13
        date: '2024-11-13'
        additions:
          - Discount code accepted on Receipt, Assign and BookRequest; discount price detail returned on Receipt, Assign and RecapResponse.
      - version: Patch 12
        date: '2024-11-13'
        additions:
          - Errata messages added to Receipt, Assign and RecapResponse.
      - version: Patch 11
        date: '2024-11-13'
        additions:
          - Board types UA and LD added.
  - api: tui-group:tui-supply
    name: Supply
    url: https://developer.tui/api-catalog/supply/release-notes
    last_updated: '2026-02-18'
    current: 1.5.1 patch 9
    quality: rich
    entries:
      - version: Patch 9
        date: '2026-02-18'
        additions:
          - XSD — SupplyTransferInfo and TransferAvailability added.
