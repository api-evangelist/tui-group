method: derived
source: >-
  mcp/tui-group-mcp.yml (candidate tool surface) bound to openapi/*.yml operationIds, plus the
  GraphQL surface declared by openapi/tui-group-tui-ship-content-api-openapi.yml.
description: >-
  TUI ships no MCP server, so this crosswalk binds the API Evangelist candidate tool surface to the
  backing OpenAPI operations rather than reconciling a published tool list. Confidence is high
  throughout because every row is a 1:1 binding to an operationId verified in the harvested spec —
  there is no name-matching guesswork. The value of the crosswalk here is the divergence it records:
  a GraphQL surface whose schema cannot be read anonymously, and 1,230 REST operations with no tool
  at all, almost all of them inside two Navitaire products that a tour operator re-exposes rather
  than authors.
surfaces:
  openapi:
    location: openapi/*.yml
    documents: 21
    operations: 1261
    gated: false
    note: >-
      All 21 documents are publicly downloadable from the portal's Swagger UI at
      https://developer.tui/system/files/<yyyy-mm>/<id>-openapi-spec.yml. The runtime behind them is
      not public — every call needs an OAuth 2.0 client-credentials token plus an approved product
      subscription.
  graphql:
    endpoint: https://prod.api.tui/cruises/ship/graphql
    declared_in: openapi/tui-group-tui-ship-content-api-openapi.yml (POST /graphql)
    gated: true
    note: >-
      Introspection is auth-gated. An anonymous POST of {__schema{queryType{name}}} returns the
      Apigee fault {"fault":{"faultstring":"Invalid access token","detail":{"errorcode":"oauth.v2.InvalidAccessToken"}}}
      (HTTP 401, probed 2026-07-28), so no SDL could be captured. The OpenAPI wrapper declares a
      single Ship response schema covering cabin types, board types and deck plans; the field-level
      query surface is unknown without credentials.
  mcp:
    url: null
    gated: n/a
    note: No hosted MCP server exists. See the probe record in mcp/tui-group-mcp.yml.
