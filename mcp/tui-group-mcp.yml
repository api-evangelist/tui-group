notes:
- Every candidate tool inherits its real input contract from the backing OpenAPI operation's parameters
  and requestBody. No input schema is invented here.
- All of these operations sit behind an OAuth 2.0 client-credentials token from https://prod.api.tui/oauth2/token
  plus a partner-manager-approved product subscription, and several additionally require a Navitaire New
  Skies agent profile and a production IP allowlist entry. An MCP server over this estate would be a partner-credentialed
  server, never a public one.
- 'Read-only shopping and content operations are the agent-safe subset. The booking, payment and departure-control
  operations are not: TUI publishes no idempotency contract, so a retried tool call has no defined safe-replay
  behaviour (see conventions/tui-group-conventions.yml).'
