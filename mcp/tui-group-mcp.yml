excluded_surfaces:
- api: tui-group:tui-newskies-digital-api
  operations: 1060
  reason: Navitaire New Skies reservation and operations surface re-exposed under TUI paths. Far too large
    and too consequential (booking mutation, payments, refunds, reversals, 3-D Secure) to expose as agent
    tools without a per-operation governance pass — see agentic-access/tui-group-agentic-access.yml.
- api: tui-group:tui-newskies-gonow-api
  operations: 88
  reason: Departure Control System — check-in, bag tags, boarding passes, disruption handling. Physical,
    safety-adjacent airport operations; not an agent surface.
- api: tui-group:tui-newskies-payment-api
  operations: 24
  reason: PCI-DSS scoped payment proxy. Excluded on principle.
- api: tui-group:tui-flight-ndc-gateway
  operations: 30
  reason: NDC 21.3 message set is viable as tools, but the published operationIds contain spaces ("POST
    OfferPriceRQ v21.3") and are duplicated across the v21.3 and v2 families, so they are not usable as
    MCP tool names without a curation pass.
- api: tui-group:tui-b2bota-g7-travelmessage
  operations: 10
  reason: Session-based XML dialogue with no operationIds in the spec; a stateful flow rather than independent
    tool calls.
- api: tui-group:tui-ship-content-api
  reason: Single GraphQL endpoint; would be exposed as a query tool, not as REST-shaped tools.
