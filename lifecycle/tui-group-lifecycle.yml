generated: '2026-07-28'
method: searched
source: >-
  https://developer.tui/api-catalog/*/release-notes (8 of 21 products publish a dated release-notes
  tab), https://developer.tui/docs/getting-started_environments,
  https://developer.tui/api-catalog/*/backwards-compatibility, plus deprecated operations derived
  from the harvested OpenAPI documents.
description: >-
  TUI has no single, provider-wide lifecycle policy. Versioning, deprecation and change
  communication are handled per product, and the quality varies from excellent (the ANVR G7
  TravelMessage channel maintains a numbered patch log going back to 2024 with explicit behavioural
  changes) to absent (11 of the 21 products publish no release notes at all). There is no status
  page, no SLA, no RFC 8594 Sunset/Deprecation header support, and no deprecation window commitment
  anywhere on the portal.
versioning:
  scheme: mixed, per product
  mechanisms:
    - scheme: uri-path
      examples:
        - NDC Gateway — /r3.x/v21.3/{Operation} (Navitaire NDC API) and /r3.x/v2/{Operation} (Navitaire Digital API)
        - New Skies Digital API — /rest/api/nsk/{v1..v7}/... with several versions of the same resource live at once
        - Meta partner APIs — /v1-beta path segment
    - scheme: accept-header
      examples:
        - CheckInHandler Service API and HolidayOffersController document a versioned Accept header
    - scheme: document-version-only
      examples:
        - Cruise, content and supply products carry info.version with no wire-level version selector
  current_versions:
