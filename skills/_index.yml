cross_cutting_rules:
  - >-
    No operation in TUI's estate accepts an idempotency key. Never blind-retry a booking, order or
    payment call; read the booking back (Recap, OrderRetrieve) before deciding.
  - >-
    Four incompatible error envelopes coexist — RFC 9457 problem+json, the Navitaire
    ErrorResponse/Exception shape, the Apigee fault envelope, and ANVR numbered XML messages. See
    errors/tui-group-problem-types.yml.
  - >-
    TUI publishes no rate-limit headers and no 429 contract. Throttle client-side to your assigned
    quota tier (rate-limits/tui-group-rate-limits.yml).
  - >-
    Log x-correlation-id (search / check-in products) or x-Trace-Id (cruise products) on every call —
    TUI's production workflow validation requires correlation IDs as evidence.
