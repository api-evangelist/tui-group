source: >-
  npm registry metadata for the @tui scope (registry.npmjs.org), probed 2026-07-28, plus every
  documentation page on https://developer.tui.
description: >-
  TUI publishes no embeddable components for API partners — there is no hosted booking widget, no
  drop-in search element, no embedded dashboard and no JS loader offered anywhere on developer.tui.
  What TUI does publish, and publishes openly on the public npm registry, is its internal front-end
  design system: a CSS library plus an Atomico-based web-component set that powers TUI's consumer
  websites. This is recorded because the packages are genuinely first-party, genuinely public and
  genuinely client-side components — but their audience is TUI's own web teams, not the partners who
  integrate the 21 API products. Nothing here is documented on the developer portal or referenced
  from any API product page.
audience: TUI internal / consumer web front-ends — not API partners
documented_on_developer_portal: false
partner_embeddables:
  available: false
  searched:
    - https://developer.tui/docs/overview
    - https://developer.tui/docs/getting-started
    - https://developer.tui/api-catalog
    - all 21 API product pages and their sub-tabs
  finding: >-
    No widget, element library, hosted checkout, embedded search or iframe surface is offered to
    partners. Every published integration path is a server-side API call.
families:
