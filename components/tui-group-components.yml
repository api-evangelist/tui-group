        last_published: '2026-07-23'
      - name: "@tui/ui-library"
        version: 4.21.0
        url: https://www.npmjs.com/package/@tui/ui-library
        role: TUI UI CSS library — the styling layer, on a v4 line since 2021 with a v5 beta open.
        last_published: '2026-04-07'
      - name: "@tui/cally"
        version: 1.0.0
        url: https://www.npmjs.com/package/@tui/cally
        role: >-
          TUI's fork of the Cally date-picker custom elements (WickyNilliams/cally), built on
          Atomico. The only true web-component package in the set — relevant to travel because the
          date range picker is the core of a holiday search UI.
        license: MIT
        upstream: https://github.com/WickyNilliams/cally
        last_published: '2026-07-03'
    source_repositories:
      - git@ssh.source.tui:osp/browse/design-system/uilib.git
      - git@ssh.source.tui:osp/tech-enablers/ui-library.git
      - git@ssh.source.tui:osp/browse/design-system/cally.git
    source_public: false
    note: >-
      The packages are public on npm; the repositories they point at are on TUI's private GitLab
      (source.tui) and are not readable. There is no public design-system documentation site,
      Storybook or component gallery.
