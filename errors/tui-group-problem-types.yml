source: openapi/*.yml (4xx/5xx responses across all 21 harvested TUI OpenAPI documents), plus https://developer.tui/api-catalog/newskies-payment-api/api-description
  (error-handling section), https://developer.tui/api-catalog/b2bota-g7/release-notes (ANVR message numbers)
  and live gateway probes.
format: mixed
description: 'TUI publishes no single cross-product error reference. Error semantics are per-API and per-backend:
  the Apigee-native search / cruise / meta products return RFC 9457 application/problem+json; the Navitaire
  New Skies products (Digital API, GoNow) return a proprietary ErrorResponse / Exception envelope as application/json;
  the ANVR G7 TravelMessage channel returns numbered ANVR message codes inside the XML dialogue rather
  than HTTP problem bodies; and the Apigee gateway itself returns its own fault envelope for auth failures
  before a request ever reaches a backend.'
