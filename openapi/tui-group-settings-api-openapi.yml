components:
  schemas:
    IJsonResponseOfAgencyCreationSettings:
      type: object
      description: "Defines the JSON response contract.\n            "
      additionalProperties: false
      properties:
        data:
          description: "The payload data.\n            "
          $ref: '#/components/schemas/AgencyCreationSettings'
