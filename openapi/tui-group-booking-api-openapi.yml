  /api/nsk/v1/booking/fee/{feeKey}:
    put:
      tags:
      - booking
      summary: Overrides a fee amount.
      description: 'When the fee override amount is zero, New Skies keeps or removes passenger fees with respect to the Store

        Confirming Waived Fees system setting.

        This endpoint returns a HTTP 200 on either case. Please retrieve the state booking afterwards to verify the absence

        or presence of the overridden fee.

        IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.


        GraphQL endpoint: feeSet'
      operationId: nsk_v1_booking_fee_feeKey_put
      parameters:
      - name: feeKey
        in: path
        required: true
        description: The fee key.
        schema:
          type: string
        x-position: 1
      requestBody:
        x-name: request
        description: The fee request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeeRequestBase'
        required: true
        x-position: 2
      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '409':
          description: Concurrent changes were being made in the same session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
    delete:
      tags:
      - booking
      summary: Deletes a fee.
      description: 'If a fee is deleted during the same commit in which it was added, then the fee will not be present on the booking

        -- It is truly deleted

        If a fee is waived after it has been committed to a booking, then the fee will still be present, along with a "FEE

        OR" fee indicating the override is 0.

        This behavior can be changed by checking the "Store Confirming Waived Fees" box in the Booking Settings dialog in

        utilities (SYS Users Only).  If this box

        is checked, then all fees will behave in the second manner shown above -- meaning that an uncommitted fee that is

        overriden to 0 will not be removed from

        the booking.

        Additionally, if the fee was added pre-commit and the SkySpeed setting ''Allow Fees to be Deleted'' is enabled for

        that user,

        then they will be able to delete the fee without needing waive fee permissions. Post-commit we still require waive

        fee permissions

        to override a fee.

        IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.


        GraphQL endpoint: feeDelete'
      operationId: nsk_v1_booking_fee_feeKey_delete
      parameters:
      - name: feeKey
        in: path
        required: true
        description: The fee key request.
        schema:
          type: string
        x-position: 1
      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '409':
          description: Concurrent changes were being made in the same session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
