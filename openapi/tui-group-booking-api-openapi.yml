        performed before committing the booking. New Skies refers to this as MergeAndCommit2. We recommend only

        setting this flag to true for cases where concurrent booking changes are highly possible (e.g. multiple

        sessions making changes to the same booking right before checking-in).

        IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.


