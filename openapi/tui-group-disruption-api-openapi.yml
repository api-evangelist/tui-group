        availabilitySourceCode:
          type:
          - string
          - 'null'
        segmentKey:
          type:
          - string
          - 'null'
        carrierCode:
          type:
          - string
          - 'null'
        flightNumber:
          type:
          - string
          - 'null'
        opSuffix:
          type:
          - string
          - 'null'
        origin:
          type:
