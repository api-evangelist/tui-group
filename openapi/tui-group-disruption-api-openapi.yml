          items:
            $ref: '#/components/schemas/DisruptionFinalDestinationJourney'
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ErrorResponse'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Message'
    DisruptionFinalDestinationJourney:
      type: object
      additionalProperties: false
      properties:
