            $ref: '#/components/schemas/DisruptionPassenger'
        segments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DisruptionFinalDestinationSegment'
    Message:
      type: object
      additionalProperties: false
      properties:
        code:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/MessageStatus'
        details:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
    IJsonResponseOfDisruptionCombinedJourney:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/DisruptionCombinedJourney'
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ErrorResponse'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Message'
    DisruptionMoveResponse:
      type: object
      additionalProperties: false
      properties:
        successfulRecordLocators:
          type:
          - array
          - 'null'
          description: List of record locators for the bookings whose passengers were successfully moved.
          items:
            type: string
        failedRecordLocators:
          type:
          - array
          - 'null'
          description: 'List of record locators for the bookings whose passengers were NOT moved, including the

            associated error that prevented the move.  Note: There is one error per failed record

            locator.'
          items:
            $ref: '#/components/schemas/DisruptionMoveError'
    DisruptionInventoryControlType:
      type: integer
      description: 'Defines the different ways inventory can be requested during a disruption move.


        0 = ClaimSpace

        1 = OversellSpace

        2 = StandBy'
      x-enumNames:
      - ClaimSpace
      - OversellSpace
      - StandBy
      enum:
      - 0
      - 1
      - 2
    DisruptionPassenger:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/SegmentStatus'
        seat:
          type:
          - string
          - 'null'
        fareClass:
          type:
          - string
          - 'null'
        passengerCount:
          type: integer
          description: The Number of passengers in the booking.
        priorityCode:
          type:
          - string
          - 'null'
        guestRecognitionValue:
          type: integer
          format: int32
        name:
          $ref: '#/components/schemas/Name'
        passengerNumber:
          type: integer
          description: The Passenger's number based on their order in the booking.
        recordLocator:
          type:
          - string
          - 'null'
    IJsonResponse:
      type: object
      additionalProperties: false
      properties:
        data: {}
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ErrorResponse'
        messages:
