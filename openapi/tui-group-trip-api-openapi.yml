  /api/nsk/v1/trip/contacts:
    post:
      tags:
      - trip
      summary: Creates a new contacts-only booking.
      description: 'This endpoint is not for updating contacts on an existing booking.

        For that purpose, use the "booking/contacts/{contactTypeCode}" endpoints for PUT and PATCH.

        This endpoint is to create a new contacts-only booking.

        An example use case for a contacts-only booking are agency gift certificates (Agency Contact)

        where a payment is made with the organization credit and left as a credit on the PNR.

        IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.


        GraphQL endpoint: tripContactsAdd'
      operationId: nsk_v1_trip_contacts_post
      requestBody:
        x-name: tripContactsRequest
        description: The trip contacts request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripContactsRequest'
            examples:
              Valid trip contacts request:
                description: Example request for creating a contacts only booking.
                value:
                  data:
                    contacts:
                    - contactTypeCode: P
                      phoneNumbers:
                      - type: 1
                        number: '1234'
                      cultureCode: null
                      address:
                        lineOne: '123'
                        lineTwo: null
                        lineThree: null
                        countryCode: null
                        provinceState: null
                        city: City
                        postalCode: '100'
                      emailAddress: mail@mail.com
                      customerNumber: null
                      sourceOrganization: null
                      distributionOption: null
                      notificationPreference: null
                      companyName: null
                      name:
                        first: John
                        middle: null
                        last: Doe
                        title: null
                        suffix: null
        required: true
        x-position: 1
      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponseOfBooking'
              examples:
                Contacts-only booking:
                  description: Example response for successfully creating a contacts-only booking.
                  value:
                    data:
                      selfServiceMoveAvailable: false
                      bookingKey: null
                      recordLocator: null
                      currencyCode: null
                      systemCode: null
                      groupName: null
                      locators: null
                      info:
                        status: 0
                        paidStatus: 0
                        priceStatus: 0
                        profileStatus: 0
                        bookingType: null
                        channelType: 0
                        bookedDate: '2026-07-09T05:55:13.5552699+00:00'
                        createdDate: null
                        expirationDate: null
                        modifiedDate: null
                        modifiedAgentId: 0
                        createdAgentId: 0
                        owningCarrierCode: null
                        changeAllowed: false
                        createdUserKey: MA--
                        modifiedUserKey: null
                      sales: null
                      typeOfSale: null
                      hold: null
                      breakdown: null
                      receivedBy: null
                      contacts:
                        p:
                          contactTypeCode: P
                          phoneNumbers:
                          - type: 1
                            number: '1234'
                          cultureCode: null
                          address:
                            lineOne: '123'
                            lineTwo: null
                            lineThree: null
                            countryCode: null
                            provinceState: null
                            city: City
                            postalCode: '100'
                          emailAddress: mail@mail.com
                          customerNumber: null
                          sourceOrganization: null
                          distributionOption: null
                          notificationPreference: null
                          companyName: null
                          name:
                            first: John
                            middle: null
                            last: Doe
                            title: null
                            suffix: null
                      passengers: null
                      journeys: null
                      comments: null
                      queues: null
                      history: null
                      payments: null
                      addOns: null
                      orders: null
        '400':
          description: There was a problem with the request and it could not be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
              examples:
                With invalid contact type code:
                  description: The contact type code is invalid or not configured in the system. The list of valid contact type codes can be retrieved using the GET api/nsk/v1/resources/ContactTypes endpoint.
                  value:
                    errors:
                    - id: 12bd2c3d-ddd4-5844-3sz5-3cg52c2e13n1
                      code: nsk:Contact:InvalidContactTypeCode
                      message: The contact type code 'S' is invalid.
                      type: Validation
                      details:
                        contactTypeCode: S
                      rawMessage: The contact type code 'S' is invalid.
                      exception: null
                      debugMode: The API is currently running in debug mode. In production the 'rawMessage' and 'exception' nodes will not be returned. These are for troubleshooting development issues only.
                With duplicate contact type code:
                  description: The contact type code already exists in the request.
                  value:
                    errors:
                    - id: 99cd1b2b-ccc3-4733-7fa4-2bf49b1d98c0
                      code: nsk:Contact:DuplicateTypeCode
                      message: Duplicate contact type 'P' detected.
                      type: Validation
                      details:
                        contactTypeCode: P
                      rawMessage: Duplicate contact type 'P' detected.
                      exception: null
                      debugMode: The API is currently running in debug mode. In production the 'rawMessage' and 'exception' nodes will not be returned. These are for troubleshooting development issues only.
                With no contact type code:
                  description: The contact type code in the request is not populated.
                  value:
                    errors:
                    - id: 5f490eab-3a4d-a783-14ed-25456aecf82f
                      code: Contact.ContactTypeCode:RequiredAttribute
                      message: The Contact field is required.
                      type: Validation
                      details: null
                      rawMessage: The Contact field is required.
                      exception: null
                      debugMode: The API is currently running in debug mode. In production the 'rawMessage' and 'exception' nodes will not be returned. These are for troubleshooting development issues only.
                With incomplete booking contact information:
                  description: The booking contact information provided is incomplete.
                  value:
                    errors:
                    - id: 666e7592-c107-3812-46e6-f7147dd3c5cd
                      code: nsk-server:BookingContactInfoIncomplete
                      message: Missing or invalid GST Registration Number.
                      type: Validation
                      details: null
                      rawMessage: Missing or invalid GST Registration Number.
                      exception: null
                      debugMode: The API is currently running in debug mode. In production the 'rawMessage' and 'exception' nodes will not be returned. These are for troubleshooting development issues only.
                With booking already in state:
                  description: There is already a booking in state.
                  value:
                    errors:
                    - id: 505b55d3-cac8-93a9-4d25-131256cdd551
                      code: nsk:Booking:AlreadyExistsInState
                      message: Booking already exists in state. Try again after reseting the state.
                      type: Error
                      details: null
                      rawMessage: Booking already exists in state. Try again after reseting the state.
                      exception: null
                      debugMode: The API is currently running in debug mode. In production the 'rawMessage' and 'exception' nodes will not be returned. These are for troubleshooting development issues only.
                With null request:
                  description: The trip contact request field is null
                  value:
                    errors:
                    - id: 292fcb67-e1de-eb62-3d1a-123a586b03a9
                      code: core:Validation:NullRequest
                      message: The request is null or couldn't be converted to the expected data type.
                      type: Error
                      details: null
                      rawMessage: The request is null or couldn't be converted to the expected data type.
                      exception: null
                      debugMode: The API is currently running in debug mode. In production the 'rawMessage' and 'exception' nodes will not be returned. These are for troubleshooting development issues only.
                    data: null
