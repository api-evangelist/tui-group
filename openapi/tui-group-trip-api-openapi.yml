  /api/nsk/v1/trip/standby/availability:
    post:
      tags:
      - trip
      summary: Retrieves same-day standby availability relevant to the current state booking.
      description: 'This endpoint only provisions same-day standby availability. The existing, standard flight availability

        endpoints should still be used for other standby availability search scenarios.

        Although this endpoint behaves like a GET, POST reduces the limitations resulting from URL length issues.

        Even though service bundle offers is part of the endpoint response, it is expected to be not populated.


        GraphQL endpoint: tripStandbyAvailability'
      operationId: nsk_v1_trip_standby_availability_post
      requestBody:
        x-name: request
        description: The standby availability request to use in the search.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityStandbyRequest'
        required: true
        x-position: 1
      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponseOfAvailabilityv2'
        '404':
          description: The item was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
