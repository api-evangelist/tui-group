openapi: 3.2.0
info:
  title: NewSkies-Digital-Api Trip API
  version: 4.8.6.23
  description: Navitaire Digital Api
servers:
- url: https://prod.api.tui/flight/newskies/rest
  description: TUI Prod
- url: https://playground.api.tui/flight/newskies/rest
  description: TUI Playground
security:
- JWT: []
tags:
- name: trip
paths:
  /api/nsk/v5/trip:
    post:
      tags:
      - trip
      summary: Creates a new booking with the provided journeys, contacts, passengers, and SSRs.
      description: '`IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.`


        GraphQL endpoint: tripCreatev5'
      operationId: nsk_v5_trip_post
      parameters:
      - name: syncPassengerAndTravelDocGender
        in: query
        description: "Indicates whether to synchronize the passenger and all its travel\ndocuments' gender. This will update the gender of all the travel documents in the\npassengers[passengerKey].travelDocuments list in the booking model. The value defaults to true if not specified.\n            "
        schema:
          type: boolean
          default: true
        x-position: 2
      requestBody:
        x-name: request
        description: The booking sell request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingSellRequest'
        required: true
        x-position: 1
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponseOfBooking'
        '400':
          description: There was a problem with the request and it could not be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
              examples:
                Passenger type not allowed for infant in lap.:
                  description: Example when attempting to add an infant in lap to a passenger type that is not allowed.
                  value:
                    errors:
                    - id: 305fe78c-03e9-4c68-a8f8-5841b5dc6a10
                      code: nsk:Passenger:PassengerTypeNotAllowedForInfantInLap
                      message: Passenger with type CHD is not allowed to have an infant in lap.
                      type: Validation
                      details: null
                      rawMessage: Passenger with type CHD is not allowed to have an infant in lap.
                      exception: null
                      debugMode: The API is currently running in debug mode. In production the 'rawMessage' and 'exception' nodes will not be returned. These are for troubleshooting development issues only.
                    data: null
                No POST request body.:
                  description: Example when making a call without a request body.
                  value:
                    errors:
                    - id: 5560684d-8fa9-47f1-b2f6-ebe6380d5b69
                      code: nsk:Exceptions:Null
                      message: An unexpected null value of type 'BookingSellRequest'.
                      type: Validation
                      details: null
                      rawMessage: An unexpected null value of type 'BookingSellRequest'.
                      exception: null
                      debugMode: The API is currently running in debug mode. In production the 'rawMessage' and 'exception' nodes will not be returned. These are for troubleshooting development issues only.
                    data: null
  /api/nsk/v4/trip:
    post:
      tags:
      - trip
      summary: Creates a new booking with the provided journeys, contacts, passengers, and SSRs.
      description: '`IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.`


        GraphQL endpoint: tripCreatev4'
      operationId: nsk_v4_trip_post
      requestBody:
        x-name: request
        description: The booking sell request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingSellRequest'
        required: true
        x-position: 1
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponseOfBooking'
        '400':
          description: There was a problem with the request and it could not be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '409':
          description: Concurrent changes were being made in the same session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
      deprecated: true
  /api/nsk/v1/trip/{legKey}/seats/{unitKey}/properties:
    get:
      tags:
      - trip
      summary: BETA - Retrieves inventory seat properties for a given flight leg and unit key.
      description: 'This is a beta endpoint and is not currently a long term supported endpoint. This endpoint may be removed in future updates.

        Beta endpoints are not available in all labs or for all customers of the API.


        GraphQL endpoint: inventorySeatProperties'
