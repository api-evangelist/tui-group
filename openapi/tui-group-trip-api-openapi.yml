  /api/nsk/v1/trip/info/{legKey}/status:
    patch:
      tags:
      - trip
      summary: Stateless operation for updating the trip information status for a specific flight.
      description: 'A flight must be within three days of leaving to be able to make flight

        following information changes.

        An empty string or whitespaces are allowed input values and are not considered as null

        inputs. Null values will retain the original value in the trip status while empty strings

        or whitespaces will clear the value from the trip status.

        When updating tail numbers, this endpoint will not validate mismatching equipment types.

        If validation is required for tail numbers, please see `POST /equipment/tailNumber`.


        GraphQL endpoint: tripInformationStatusModify'
      operationId: nsk_v1_trip_info_legKey_status_patch
      parameters:
      - name: legKey
        in: path
        required: true
        description: The leg key of the flight being updated.
        schema:
          type: string
        x-position: 1
      requestBody:
        x-name: request
        description: The trip information status request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripInformationStatusRequestBase'
        required: true
        x-position: 2
      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
              examples:
                Update flight following information successful:
                  description: Example response when flight following information is updated successfully.
                  value:
                    data: null
                Mismatch tail number equipment type:
                  description: Example response when the tail number is updated even if the equipment type is mismatching.
                  value:
                    messages:
                    - code: nsk:TripStatus:EquipmentTypeMismatch
                      type: Information
                      value: nsk:TripStatus:EquipmentTypeMismatch
                      status: 0
                      details:
                        flightEquipmentType: '767'
                        tailNumberEquipmentType: '731'
                    data: null
        '400':
          description: There was a problem with the request and it could not be completed.
