  /api/nsk/v4/availability/search:
    post:
      tags:
      - availability
      summary: 'Searches for availability with the full availability search request. This request allows for total control over

        the configuration. If a property is not set, default values will be set instead. These defaults are what we

        consider a general optimized request. If these optimizations are not preferred the requester will need to

        opted out the filters on the availability request.'
      description: 'Note: It is advised to optimize the availability request with passing in at least one or more (ProductClass,

        TravelClass, FareTypes or ClassesOfService) so the response can be optimized as possible. This is even more

        recommended for mobile applications due to the nature of limited network capabilities.

        The default values that will be set unless specified:

        - TaxesAndFees = TaxesAndFeesRollupMode.None

        - Criteria.SsrCollectionsMode = AvailabilitySsrCollectionsMode.None

        - Criteria.Filters.FareInclusionType = AvailabilityType.Default

        - Criteria.Filters.CompressionType = FareClassControl.LowestFareClass

        - Criteria.Filters.Loyalty = LoyaltyFilter.MonetaryOnly

        - Criteria.Filters.FlightType = FlightType.All

        - Criteria.Filters.ExclusionType = AvailabilityFilter.ExcludeUnavailable

        - Criteria.Filters.SortOptions =

        JourneySortKey.LowestFare,JourneySortKey.EarliestDeparture,JourneySortKey.ShortestTravelTime

        - Filters.ConnectionType = SoldAsConnectionType.None

        - Criteria.Filters.MaxConnectingFlights = 0

        - Criteria.Stations.SearchDestinationMacs = false

        - Criteria.Stations.SearchOriginMacs = false

        - Criteria.Filters.BundleControlFilter = BundleControlFilter.Disabled

        - NumberOfFaresPerJourney = 1

        Criteria.Filters.IncludeServiceBundleSetCodes is marked as obsolete, and the use of

        BundleControlFilter is preferred. To specifically return bundle set codes which IncludeServiceBundleSetCodes has

        originally provided when set to true, use an enumeration value of BundleControlFilter.ReturnBundleSets for

        BundleControlFilter instead.

        When searching for open jaw availability the results will contain only available markets if any are configured.

        The AvailabilityCriteriaFilter.FareInclusionType.NoPricing enumeration value, if set, will result in an

        availability response that does not include fares.  The primary use case for this is in Move flows, but is being

        maintained on the main availability and rebook availability flows in case there are other use cases as well.


        GraphQL endpoint: availabilityv5'
      operationId: nsk_v4_availability_search_post
      requestBody:
        x-name: request
        description: The availability search request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityRequestv3'
        required: true
        x-position: 1
      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponseOfAvailabilityv2'
              examples:
                Requested Passenger Discount Overridden Message:
                  description: Example OSI Message when getting availability with a promotion code, no requested passenger discount, and the promotion code has a passenger discount associated with it. *NOTE*:This example *only* displays the message, however, the availability data will be populated in addition the given message.
                  value:
                    messages:
                    - rawValue: 'A passenger discount code was found that is associated with the requested promotion code. The passenger discount code on the request has been override with the following associated discount code: SNR.'
                      code: PassengerDiscountCodeOverridden
                      debugMode: The API is currently running in debug mode. In production the 'rawValue' node will not be returned. These are for troubleshooting development issues only.
                      type: Information
                      value: PassengerDiscountCodeOverridden
                      status: 0
                      details:
                        associatedDiscountCode: SNR
                    data: null
        '400':
          description: There was a problem with the request and it could not be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '403':
          description: Role permissions are not met.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '404':
          description: The item was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
  /api/nsk/v4/availability/search/simple:
    post:
      tags:
      - availability
      summary: 'Searches for availability with the simple availability search request. This request allows for easy setup for one

        way and round trip searches. If a property is not set, default values will be set instead just like they would in

        the full availability request. These defaults are what we consider a general optimized request. If these

        optimizations are not preferred the requester will need to opted out the filters on the availability simple

        request.'
      description: 'Note: It is advised to optimize the availability request with passing in at least one or more (ProductClass,

        TravelClass, FareTypes or ClassesOfService) so the response can be optimized as possible. This is even more

        recommended for mobile applications due to the nature of limited network capabilities.

        The default values that will be set unless specified:

        - TaxesAndFees = TaxesAndFeesRollupMode.None

        - SsrCollectionsMode = AvailabilitySsrCollectionsMode.None

        - Filters.FareInclusionType = AvailabilityType.Default

        - Filters.CompressionType = FareClassControl.LowestFareClass

        - Filters.Loyalty = LoyaltyFilter.MonetaryOnly

        - Filters.FlightType = FlightType.All

        - Filters.ExclusionType = AvailabilityFilter.ExcludeUnavailable

        - Filters.SortOptions =

        JourneySortKey.LowestFare,JourneySortKey.EarliestDeparture,JourneySortKey.ShortestTravelTime

        - Filters.ConnectionType = SoldAsConnectionType.None

        - Filters.MaxConnectingFlights = 0

        - SearchDestinationMacs = false

        - SearchOriginMacs = false

        - Criteria.Filters.BundleControlFilter = BundleControlFilter.Disabled

        - NumberOfFaresPerJourney = 1

        Note that the searchOriginMacs and searchDestinationMacs flags apply to both journeys when booking a round-trip

        journey with the simple availability endpoint.  For example, if you set "searchOriginMacs" to "true" for a

        round trip from SLC-BOS and back, it will search for SLC MAC airports on the outbound (SLC > BOS) journey, and

        BOS MAC airports on the inbound (BOS > SLC) journey

        Criteria.Filters.IncludeServiceBundleSetCodes is marked as obsolete, and the use of

        BundleControlFilter is preferred. To specifically return bundle set codes which IncludeServiceBundleSetCodes has

        originally provided when set to true, use an enumeration value of BundleControlFilter.ReturnBundleSets for

        BundleControlFilter instead.

        The AvailabilityCriteriaFilter.FareInclusionType.NoPricing enumeration value, if set, will result in an

        availability response that does not include fares.  The primary use case for this is in Move flows, but is being

        maintained on the main availability and rebook availability flows in case there are other use cases as well.


        GraphQL endpoint: availabilitySimplev4'
      operationId: nsk_v4_availability_search_simple_post
      requestBody:
        x-name: request
        description: The availability simple v2 search request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilitySimpleRequestv2'
        required: true
        x-position: 1
      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponseOfAvailabilityv2'
              examples:
                Requested Passenger Discount Overridden Message:
                  description: Example OSI Message when getting availability with a promotion code, no requested passenger discount, and the promotion code has a passenger discount associated with it. *NOTE*:This example *only* displays the message, however, the availability data will be populated in addition the given message.
                  value:
                    messages:
                    - rawValue: 'A passenger discount code was found that is associated with the requested promotion code. The passenger discount code on the request has been override with the following associated discount code: SNR.'
                      code: PassengerDiscountCodeOverridden
                      debugMode: The API is currently running in debug mode. In production the 'rawValue' node will not be returned. These are for troubleshooting development issues only.
                      type: Information
                      value: PassengerDiscountCodeOverridden
                      status: 0
                      details:
                        associatedDiscountCode: SNR
                    data: null
        '404':
          description: The item was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
  /api/nsk/v2/availability/search/ssr:
    post:
      tags:
      - availability
      summary: 'Searches for availability with SSR prices with the full availability search request. This request allows for total

        control over the configuration. If a property is not set, default values will be set instead. These defaults are

        what we consider a general optimized request. If these optimizations are not preferred the requester will need to

        opt out of the filters on the availability request.'
      description: 'Note: This is an expensive call and should be used with appropriate cautions.

        It is advised to optimize the availability request with passing in at least one or more (ProductClass,

        TravelClass, FareTypes or ClassesOfService) so the response can be optimized as possible. This is even more

        recommended for mobile applications due to the nature of limited network capabilities.

        The default values that will be set unless specified:

        - AvailabilityWithSsrRequest.TaxesAndFees = TaxesAndFeesRollupMode.None

        - AvailabilityWithSsrRequest.Criteria.SsrCollectionsMode = AvailabilitySsrCollectionsMode.None

        - AvailabilityWithSsrRequest.Criteria.Filters.FareInclusionType = AvailabilityType.Default

        - AvailabilityWithSsrRequest.Criteria.Filters.CompressionType = FareClassControl.LowestFareClass

        - AvailabilityWithSsrRequest.Criteria.Filters.Loyalty = LoyaltyFilter.MonetaryOnly

        - AvailabilityWithSsrRequest.Criteria.Filters.FlightType = FlightType.All

        - AvailabilityWithSsrRequest.Criteria.Filters.ExclusionType = AvailabilityFilter.ExcludeUnavailable

        - AvailabilityWithSsrRequest.Criteria.Filters.SortOptions =

        JourneySortKey.LowestFare,JourneySortKey.EarliestDeparture,JourneySortKey.ShortestTravelTime

