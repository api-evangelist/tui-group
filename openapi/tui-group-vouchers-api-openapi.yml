  /api/nsk/v1/vouchers/{voucherKey}/owner:
    patch:
      tags:
      - vouchers
      summary: Changes the voucher owner.
      description: 'This endpoint requires agent permissions.

        If the personKey is populated, the voucher owner''s first and last name will be updated to match what

        corresponds with the person.

        If no personKey is given, the names in the request will be used to update the voucher.

        Additionally, there are configuration restrictions to be able to use this endpoint.

        First, the voucher must be allowed to be used by the Agent, under Booking Payments Codes -> Voucher Basis Codes.

        Second, the voucher basis must have usage type "Match On Passenger Name" or "Match on Passenger or Contact Name".

        Related endpoints:

        - GET /api/nsk/v2/vouchers: Lookup vouchers. Agent Only.

        - GET /api/nsk/v1/vouchers/{voucherKey}: Get a specific voucher.


        GraphQL endpoint: voucherOwnerModify'
      operationId: nsk_v1_vouchers_voucherKey_owner_patch
      parameters:
      - name: voucherKey
        in: path
        required: true
        description: The voucher key
        schema:
          type: string
        x-position: 1
      requestBody:
        x-name: request
        description: The voucher update request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoucherOwnerUpdateRequest'
            examples:
              Update Voucher Owner Person Key Only:
                description: Example request for when wanting to update the voucher owner of a voucher based on a person key. You can simply not set the First Name and Last Name on the request and those will be set internally.
                value:
                  personKey: MUNzPRfx
                  firstName: null
                  lastName: null
              Update Voucher Owner with First and Last Name Only:
                description: Example request for when wanting to update the voucher owner's first and last name without associating with a person key.
                value:
                  personKey: null
                  firstName: Jim
                  lastName: Bob
              Update Voucher Owner with Person Key and Names:
                description: Example request for when wanting to update the voucher owner of a voucher based on a person key. You can set FirstName and LastName, but if they don't match the Person they will be overriden.
                value:
                  personKey: MUNzPRfx
                  firstName: FirstNameMatchesPerson
                  lastName: LastNameMatchesPerson
        required: true
        x-position: 2
      responses:
        '200':
