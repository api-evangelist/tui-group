  /api/nsk/v2/manifest/{legKey}/governmentSecurityInfo:
    get:
      tags:
      - manifest
      summary: 'Retrieves the government security requirements for all passengers on the specified leg by calling the New Skies

        Government Security Service (GSS).'
      description: 'This endpoint is slower than other manifest endpoints because it requires synchronous communication with backend

        systems such as the Government Security Service (GSS) and the underlying New Skies remoting layer that brokers

        GSS calls.


        The `data.internationalFlight` property is only populated if there are passengers on the flight.


        The following response properties are only populated if the flight is international and already has passengers:

        - `data.arrivalCountry`

        - `data.departureCountry`


        This endpoint requires a session token and is agent-only.


        GraphQL endpoint: manifestGovernmentSecurityInformationv2'
      operationId: nsk_v2_manifest_legKey_governmentSecurityInfo_get
      parameters:
      - name: legKey
        in: path
        required: true
        description: The leg key.
        schema:
          type: string
        x-position: 1
      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponseOfManifestLightGovernmentSecurityInfoResponse'
              examples:
                Manifest government security information response:
                  description: Example response for retrieving the manifest government security information. This is only a sample response for NRT-SYD and values may differ depending on the GSS configuration.
