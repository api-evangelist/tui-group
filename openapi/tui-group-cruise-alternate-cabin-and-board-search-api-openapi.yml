                discount:
                - level: ROOM
                  type: PER_PAX
                  category: DISCOUNT
                  value: 0.27
                  travellers:
                  - id: '1'
                  - id: '2'
                total:
                - level: ROOM
                  type: PER_PAX
                  category: GROSS
                  value: 109.99
                  travellers:
                  - id: '1'
                  - id: '2'
              total:
              - level: ROOM
                category: GROSS
                value: 99.4
                travellers:
                - id: '1'
                - id: '2'
        board:
          type: array
          items:
            $ref: '#/components/schemas/Board'
          description: ''
          example:
          - id: string
            code: HB
            name: Half board
            prices:
            - breakdowns:
              - fare:
                - level: BOARD
                  type: PER_PAX
                  category: NET
                  value: 99.4
                  travellers:
                  - id: '1'
                  - id: '2'
                discount:
                - level: BOARD
                  type: PER_PAX
                  category: DISCOUNT
                  value: 0.27
                  travellers:
                  - id: '1'
                  - id: '2'
                total:
                - level: BOARD
                  type: PER_PAX
                  category: GROSS
                  value: 109.99
                  travellers:
                  - id: '1'
                  - id: '2'
              total:
              - level: BOARD
                type: PER_PAX
                category: GROSS
                value: 109.99
                travellers:
                - id: '1'
                - id: '2'
        sourceInformation:
          allOf:
          - $ref: '#/components/schemas/SourceInformation'
          - example:
            - category: CONTRACTED
