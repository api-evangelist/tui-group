    MetaInformation:
      title: MetaInformation
      description: Details of requester who wants to use this API
      required:
      - locale
      - market
      - brand
      - channel
      - medium
      - currency
      type: object
      properties:
        locale:
          type: string
          example: en_GB
        market:
          type: string
          example: GB
        brand:
          type: string
          example: MARELLA_UK
        channel:
          type: string
          example: B2B
        medium:
          type: string
          example: WEB
        agent:
          type: string
          example: T|MARCR
          description: 'Agent identifier in format T|XXXX where XXXX is the agent code. Examples include: T|MARCR, T|J0332, T|RIVER'
        currency:
          type: string
          example: GBP
      additionalProperties: false
