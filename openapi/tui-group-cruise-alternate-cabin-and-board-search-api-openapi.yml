openapi: 3.2.0
info:
  title: TUI Cruise Price and Availability. Cruise Alternate Cabin and Board Search API
  description: These APIs returns price and availability for given search criteria
  version: '1.0'
  contact:
    email: cruise-api-support@TUIGroup.onmicrosoft.com
    name: Cruise API Support
  x-header: 'This APIs returns cruises prices and availability for given search criteria.

    '
  x-summary: 'This API returns range of availability and pricing information that is specific to the search criteria.

    This API returns offer details and pricing information for a specific itinerary, date range, and duration.

    This API returns availability and pricing information for alternate cabins and boards.

    This API returns availability and pricing information of alternative flights for a specific cruise package.

    This API returns availability and pricing information of alternative stay variants for a specific cruise package.

    '
servers:
- url: https://prod.api.tui/cruisepriceresults
tags:
- name: Cruise Alternate Cabin and Board Search
paths:
  /v1/cruises/cabin-board-variants:
    post:
      tags:
      - Cruise Alternate Cabin and Board Search
      summary: API to get the alternate cabin and boards
      description: 'This API is designed to retrieve the availability and pricing information for alternate cabins based on the itinerary, date range, and duration provided.  It''s important to note that the API is unable to handle more than one cabin at a time. Therefore, if you want to request alternate cabins for multiple cabins,  you must make separate requests for each cabin allocation. For instance, if you select two cabins, you need to make two separate requests, one for each cabin.

        '
      operationId: getAlternateCabinAndBoards
      parameters:
      - name: x-Trace-Id
        in: header
        required: true
        description: End to end tracing ID, can be any string
        schema:
          type: string
          pattern: ^[A-Za-z0-9]{10,15}$
          example: OQ9Eu77laT
      - name: env
        in: header
        required: false
        description: A unique environment identifier for request to retrieve from correct ngs instance
        schema:
          type: string
          example: dev,test
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CruiseUniqueRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CruiseAlternateCabinAndBoardOffers'
        '400':
          description: Invalid input parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Bad Gateway
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: Gateway Timed Out
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
