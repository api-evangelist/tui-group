      title: PriceDetail
      required:
      - total
      type: object
      properties:
        breakdowns:
          type: array
          items:
            $ref: '#/components/schemas/PriceBreakdown'
          description: ''
          example:
          - fare:
            - level: DIRECTION
              type: PER_PAX
              category: NET
              value: 99.4
              travellers:
              - id: '1'
              - id: '2'
            tax:
            - level: DIRECTION
              type: PER_PAX
              category: AIRPORT_TAX
