      - UnitType
      - Occupation
      - BoardInfo
      - UnitContentID
    BoardType:
      type: string
      enum:
      - lg
      - lo
      - hp
      - vp
      - ab
      - bb
      - cb
      - br
      - vb
      - ai
      - dv
      - ph
      - pv
      - pa
      - ua
      - ld
      - LG
      - LO
      - HP
      - VP
      - AB
      - BB
      - CB
      - BR
      - VB
      - AI
      - DV
      - PH
      - PV
      - PA
      - UA
      - LD
