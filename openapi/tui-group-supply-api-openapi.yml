openapi: 3.2.0
info:
  title: Supply API
  description: "This document only describes the SupplyResponse and is a translation of the supply.xsd.\nBecause not all items in xsd schema can be translated to open API definition it is important to also use the examples.  \nFor example the Price Group:     \n&lt;Price Currency=\"EUR\" Occupation=\"1\" PricePer=\"PA\" PriceType=\"OFF\"&gt;303400&lt;/Price&gt;  \nThe Price element has attributes, but also contains the price itself. This cannot be defined in API Specification (json).\nThe price will be a group and a group can not contain a value, only items.\n"
  version: 1.5.1
  contact:
    name: G7-OTA-TEAM
    email: b2bota.g7.support@tui.nl
servers:
- url: prod.sftp.tui-b2bota-g7.nl
  description: Production
- url: playground.sftp.tui-b2bota-g7.nl
  description: Playground for testing
tags:
- name: Supply
paths:
  /supply:
    get:
      tags:
      - Supply
      summary: SupplyResponse
      description: "The SupplyResponse is here defined as a GET oparation, but in real time a (xml) file is created and placed on \na server from which third parties can retrieve them via download. Each file contains the supply for a certain \naccommodation.  \nIt contains information about the package:\n- General information  \n  Like PackageID, Description, BookPeriod and content location\n- Transport information  \n  Like Route information (from/to)\n- Accommodation/room information  \n  Like AccommodationID and AccommodationType,  \n  UnitID, Type, Board and Occupation (rules) \n- Transfer information  \n  Included transfer, that could be \"No Transfer\" or \"Standard Transfer\"\n- Price information  \n  Price for each Departuredate, Duration, Route, Unit, Board and Occupation\n"
      security:
      - oAuth2ClientCredentials: []
      responses:
        '200':
          description: Contents of supply file
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Supply'
              examples:
                SupplyResponse:
                  $ref: '#/components/examples/SupplyResponseExample'
components:
  schemas:
    SupplyResponse:
      type: object
      properties:
        SupplyPackage:
          type: array
          items:
            $ref: '#/components/schemas/SupplyPackage'
    UnitType:
      type: string
      pattern: (\d+pk)|(\d+PK)|(\d+ka)|(\d+KA)|(\d+kb)|(\d+KB)|(\d+kw)|(\d+KW)|(\d+kv)|(\d+KV)|(\d+ph)|(\d+PH)|(\d+pt)|(\d+PT)|(\d+pc)|(\d+PC)|(\d+ks)|(\d+KS)|(\d+pl)|(\d+PL)|(\d+ps)|(\d+PS)|(\d+pz)|(\d+PZ)|(\d+gk)|(\d+GK)|(\d+tc)|(\d+TC)|(div)|(DIV)|(stn)|(STN)
    PointType:
      type: string
      enum:
      - IATAcode
      - Postcode
      - Internal
      - ANVRLandStreek
      xml:
        attribute: true
    Language:
      type: string
      enum:
      - NL
      xml:
        attribute: true
    TransportType:
      type: string
      enum:
      - vl
      - bu
      - tr
      - fe
      - bo
      - ev
      - VL
      - BU
      - TR
      - FE
      - BO
      - EV
      example: VL
    OccupancyRules:
      type: object
      properties:
        MinOccupancy:
          type: integer
        MaxOccupancy:
          type: integer
        AgeCondition:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/AgeType'
        OccupancyIncluded:
          allOf:
          - $ref: '#/components/schemas/YesNoValue'
        PaxType:
          $ref: '#/components/schemas/PaxType'
      required:
      - MinOccupancy
      - MaxOccupancy
      - AgeCondition
    SupplyTransferInfo:
      type: object
      properties:
        SupplyTransfer:
          type: array
          items:
            $ref: '#/components/schemas/SupplyTransfer'
      required:
      - SupplyTransfer
    MutationType:
      type: string
      enum:
      - New
      - Mutation
      - Deletion
      - Reset
      example: Reset
    SupplyTransfer:
      type: object
      properties:
        TransferID:
          type: string
          xml:
            attribute: true
        SupplyTransferTo:
          $ref: '#/components/schemas/SupplyTransferToFrom'
        SupplyTransferFrom:
          $ref: '#/components/schemas/SupplyTransferToFrom'
      required:
      - TransferID
    SupplyAccoInfo:
      type: object
      properties:
        AccommodationID:
          type: string
        AccommodationType:
          $ref: '#/components/schemas/AccommodationType'
        Name:
          type: string
        Location:
          type: object
          properties:
            Country:
              type: string
            Area:
              type: string
            Place:
              type: string
          required:
          - Country
          - Place
        SupplyUnitInfo:
          type: array
          items:
            $ref: '#/components/schemas/SupplyUnitInfo'
      required:
      - AccommodationID
      - AccommodationType
      - Name
      - SupplyUnitInfo
    PricePer:
      type: string
      enum:
      - pn
      - pw
      - pa
      - kn
      - kw
      - ka
      - tp
      - PN
      - PW
      - PA
      - KN
      - KW
      - KA
      - TP
      example: PA
      xml:
        attribute: true
    AgeType:
      type: string
      enum:
      - Max
      - Min
      - MAX
      - MIN
      - max
      - min
      xml:
        attribute: true
    CommissionGroup:
      type: object
      properties:
        Commission:
          type: array
          items:
            $ref: '#/components/schemas/Commission'
    Transfer:
      type: object
      properties:
        TransferID:
          type: string
          xml:
            attribute: true
        Included:
          $ref: '#/components/schemas/YesNoValue'
      required:
      - TransferID
    StartAndEndDate:
      type: object
      properties:
        StartDate:
          type: string
          format: YYYY-MM-DD
        EndDate:
          type: string
          format: YYYY-MM-DD
      required:
      - StartDate
      - EndDate
    Point:
      type: object
      properties:
        PointType:
          $ref: '#/components/schemas/PointType'
        PointID:
          type: string
        Description:
          type: string
      required:
      - PointType
      - PointID
      - Description
    Route:
      type: object
      properties:
        RouteID:
          type: string
          xml:
            attribute: true
        SupplyTransportTo:
          $ref: '#/components/schemas/SupplyTransportToFrom'
        SupplyTransportFrom:
          $ref: '#/components/schemas/SupplyTransportToFrom'
        PriceNote:
          type: integer
      required:
      - RouteID
    AccommodationType:
      type: string
      enum:
      - alb
      - apo
      - app
      - bnb
      - bng
      - bry
      - cam
      - car
      - cha
      - cpr
      - cru
      - est
      - ghf
      - gue
      - hos
      - hot
      - hui
      - kas
      - mai
      - mot
      - pen
      - pou
      - res
      - rh
      - ron
      - sch
      - tnt
      - vak
      - vil
      - wng
      - ALB
      - APO
      - APP
      - BNB
      - BNG
      - BRY
      - CAM
      - CAR
      - CHA
      - CPR
      - CRU
      - EST
      - GHF
      - GUE
      - HOS
      - HOT
      - HUI
      - KAS
      - MAI
      - MOT
      - PEN
      - POU
      - RES
      - RH
      - RON
      - SCH
      - TNT
      - VAK
      - VIL
      - WNG
      example: HOT
    SupplyPriceAvailability:
      type: object
      properties:
        DepartureDate:
          type: string
          format: YYYY-MM-DD
        Duration:
          $ref: '#/components/schemas/Duration'
        TripDuration:
          $ref: '#/components/schemas/Duration'
        TransportAvailability:
          type: object
          properties:
            Route:
              type: object
              properties:
                RouteID:
                  type: string
                  xml:
                    attribute: true
                PriceNote:
                  type: integer
              required:
              - RouteID
        UnitGroup:
          type: object
          properties:
            Unit:
              type: array
              items:
                $ref: '#/components/schemas/Unit'
          required:
          - Unit
        TransferAvailability:
          type: object
          properties:
            Transfer:
              type: array
              items:
                $ref: '#/components/schemas/Transfer'
      required:
      - DepartureDate
      - Duration
    Unit:
      type: object
      properties:
        UnitID:
          type: string
        Status:
          type: string
        BoardPrice:
          type: array
          items:
            $ref: '#/components/schemas/BoardPrice'
      required:
      - UnitID
      - Status
      - BoardPrice
    SupplyTransportToFrom:
      type: object
      properties:
        TransportType:
          $ref: '#/components/schemas/TransportType'
        DepartureInfo:
          $ref: '#/components/schemas/DepartureArrivalInfo'
        ArrivalInfo:
          $ref: '#/components/schemas/DepartureArrivalInfo'
      required:
      - TransportType
      - DepartureInfo
      - ArrivalInfo
    Reference:
      type: object
      properties:
        ReferenceID:
          type: integer
        Description:
          type: string
    VersionID:
      type: string
      enum:
      - 1.5.1
      xml:
        attribute: true
    SupplyTransportInfo:
      type: object
      properties:
        Route:
          type: array
          items:
            $ref: '#/components/schemas/Route'
      required:
