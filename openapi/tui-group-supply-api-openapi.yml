        SupplyTransferInfo:
          $ref: '#/components/schemas/SupplyTransferInfo'
        SupplyPriceAvailabilityInfo:
          $ref: '#/components/schemas/SupplyPriceAvailabilityInfo'
      required:
      - MutationType
      - OfferType
      - Brand
      - PackageID
      - ProductInfo
    YesNoValue:
      type: string
      enum:
      - ja
      - nee
      xml:
        attribute: true
    BoardPrice:
      type: object
      properties:
        BoardType:
          $ref: '#/components/schemas/BoardType'
        Price:
          type: array
          items:
            $ref: '#/components/schemas/Price'
      required:
      - BoardType
      - Price
    PriceType:
      type: string
      enum:
      - false
      - SPO
      example: 'OFF'
      xml:
        attribute: true
    SupplyPriceAvailabilityInfo:
      type: object
      properties:
        SupplyPriceAvailability:
          type: array
          items:
            $ref: '#/components/schemas/SupplyPriceAvailability'
      required:
      - SupplyPriceAvailability
    DurationType:
      type: string
      enum:
      - dagen
      - nachten
      xml:
        attribute: true
    Control:
      type: object
      properties:
        Language:
          allOf:
          - $ref: '#/components/schemas/Language'
          example: NL
        Test:
          allOf:
          - $ref: '#/components/schemas/YesNoValue'
          example: nee
        SenderSessionID:
          type: string
        ReceiverSessionID:
          type: string
        Date:
          type: string
          format: YYYY-MM-DD
        Time:
          type: string
          format: HH:MM
        MessageSequence:
          type: number
        SenderID:
          type: string
        ReceiverID:
          type: string
        EmployeeID:
          type: string
        RequestID:
          type: string
        ResponseID:
          type: string
      required:
      - Language
      - SenderSessionID
      - ReceiverSessionID
      - Date
      - Time
      - MessageSequence
      - SenderID
      - ReceiverID
      - RequestID
      - ResponseID
    OccupancyRestrictions:
      type: object
      properties:
        Adult:
          type: integer
        Child:
