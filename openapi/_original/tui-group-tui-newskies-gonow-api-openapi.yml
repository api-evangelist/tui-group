            \ the second segment's departure day of year format: ddd \n    Segment2UnitDesignator:\
            \     Contains the second segment's unit designator code (seat) \n   \
            \ Segment2BoardingSequence    Contains the second segment's boarding sequence\
            \ number \n    \n    Segment3:                   The scan data associated\
            \ with the third segment in the scan,\n    Segment3Origin:           \
            \  Contains the third segment's origin station code \n    Segment3Destination\
            \         Contains the third segment's destination station code \n   \
            \ Segment3CarrierCode:        Contains the third segment's carrier code\
            \ \n    Segment3FlightNumber:       Contains the third segment's flight\
            \ number \n    Segment3OpSuffix:           Contains the third segment's\
