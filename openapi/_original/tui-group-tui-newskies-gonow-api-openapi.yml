        boardingScanRegularExpressions:
          type: array
          description: "List of regular expressions used to parse boarding scan data.\
            \ \nThere is 1 regex in the list per boarding scan type. \nSee ApiDepartureSettings.xml\
            \ for supported scan types and their respective regular expressions. \n\
            Below are the named groups that may be present after a successful regex\
            \ match. \nIf a named group is not present upon a successful regex match,\
            \ then it is not supported for the matching scan type\n\nBOARDING PASS\
            \ SHORT SCANS\n----------------------------------------------------------------------------------------------------\n\
            ScanTYpes:\n    \n    1. BoardingPassShort3\n    2. BoardingPassShort3WithOpSuffix\n\
            \    3. BoardingPassOffline3\n    4. BoardingPassShort4WithOpSuffix\n\
            \    5. BoardingPassShort4\n    6. BoardingPassOffline4\n    7. BoardingPassShort2WithOpSuffix\n\
            \    8. BoardingPassShort2\n    9. BoardingPassOffline2\n    10. BoardingPassShort1WithOpSuffix\n\
            \    11. BoardingPassShort1\n    12. BoardingPassOffline1\n\nSupported\
            \ group names:\n\n    CarrierCode:        Contains the carrier code\n\
            \    FlightNumber:       Contains the flight number,\n    OpSuffix:  \
            \         Contains the OpSuffix character,\n    Origin:      Contains\
            \ the origin station code,\n    BoardingSequence:   Contains the boarding\
            \ sequence number,\n    UnitDesignator:     Contains the unit designator\
            \ code (seat),\n    DepartureDayOfMonth:         Contains the month and\
            \ year of the flight. Format: mmdd,\n    DepartureDayOfYear: Contains\
            \ the day of year of the departure date. Format: ddd\n    \n\nBOARDING\
            \ PASS LONG SCANS\n----------------------------------------------------------------------------------------------------\n\
            ScanTYpes:\n    \n    1. BoardingPassLong1Segment\n    2. BoardingPassLong2Segment\n\
            \    3. BoardingPassLong3Segment\n    4. BoardingPassLong4Segment\n  \
            \ \nSupported group names:\n\n    LastName:           Contains the passenger's\
            \ last name,\n    FirstName:          Contains the passenger's first name,\n\
            \    RecordLocator:      Contains the PNR of the passenger's booking,\n\
            \    SegmentCount:       Contians the number of segments present in the\
            \ scan (if the scan is of type BoardingPassLong)\n    \n    MobileBarcodeDesignator:\
            \    Contains the character designating that the scan is from a mobile\
            \ barcode (if this group is not present, it is not a mobile barcode scan)\n\
            \    \n    Segment1:                   The scan data associated with the\
            \ first segment in the scan,\n    Segment1Origin:             Contains\
            \ the first segment's origin station code \n    Segment1Destination  \
            \       Contains the first segment's destination station code \n    Segment1CarrierCode:\
            \        Contains the first segment's carrier code \n    Segment1FlightNumber:\
            \       Contains the first segment's flight number \n    Segment1OpSuffix:\
            \           Contains the first segment's op suffix character \n    Segment1DepartureDayOfYear:\
            \ Contains the first segment's departure day of year format: ddd\n   \
            \ Segment1UnitDesignator:     Contains the first segment's unit designator\
            \ code (seat) \n    Segment1BoardingSequence    Contains the first segment's\
            \ boarding sequence number \n    \n    Segment2:                   The\
            \ scan data associated with the second segment in the scan,\n    Segment2Origin:\
            \             Contains the second segment's origin station code \n   \
            \ Segment2Destination         Contains the second segment's destination\
            \ station code \n    Segment2CarrierCode:        Contains the second segment's\
            \ carrier code \n    Segment2FlightNumber:       Contains the second segment's\
            \ flight number \n    Segment2OpSuffix:           Contains the second\
