                  value:
                    data:
                      passengers:
                      - passengerAlternateKey: XXXXXX
                        successfulSegments:
                        - segmentKey: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                          warnings: []
                          securityInfo: null
                          iatciMessages: null
                        failedSegments:
                        - errors:
                          - code: Oper1087
                            message: Document verification failed because passenger
