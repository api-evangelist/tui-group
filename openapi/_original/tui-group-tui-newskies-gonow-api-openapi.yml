                  value:
                    data:
                      passengers:
                      - passengerAlternateKey: XXXXXX
                        successfulSegments:
                        - segmentKey: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                          warnings: []
                          securityInfo: null
                          iatciMessages: null
                        failedSegments:
                        - errors:
                          - code: FPrc1013
