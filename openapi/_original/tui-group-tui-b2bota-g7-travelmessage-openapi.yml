    # Elements
    AccoAssignment:
      type: object
      properties:
        AccommodationID:
          type: string
        ComponentID:
          type: string
        Sequence:
          type: string
        ArrivalDate:
          type: string
          format: 'YYYY-MM-DD'
        Duration:
          $ref: '#/components/schemas/Duration'
        DepartureDate:
          type: string
          format: 'YYYY-MM-DD'
        BoardAssignment:
          type: array
          title: BoardAssignment
          items:
            $ref: '#/components/schemas/BoardAssignment'
        UnitAssignment:
          type: array
          title: UnitAssignment
          items:
            $ref: '#/components/schemas/UnitAssignment'
        ExtrasAssignment:
          type: array
          title: ExtrasAssignment
          items:
            $ref: '#/components/schemas/ExtrasAssignment'
      required:
        - AccommodationID
        - ArrivalDate
        - Duration
        - UnitAssignment
    Accommodation:
      title: Accommodation
      type: object
      properties:
        AccommodationID:
          type: string
        ComponentID:
          type: string
        AccommodationType:
          $ref: '#/components/schemas/AccommodationType'
        Name:
          type: string
        Address:
          type: string
        ZipCode:
          type: string
        Place:
          type: string
        CountryID:
          $ref: '#/components/schemas/ISOCountry'
        GPSCode:
          $ref: '#/components/schemas/GPSCode'
        Telephone:
          type: string
        ArrivalDate:
          type: string
          format: 'YYYY-MM-DD'
        DepartureDate:
          type: string
          format: 'YYYY-MM-DD'
        Duration:
          $ref: '#/components/schemas/Duration'
        Unit:
          type: array
          title: Unit
          items:
            $ref: '#/components/schemas/Unit'
        Arrangement:
          type: array
          title: Arrangement
          items:
            $ref: '#/components/schemas/Arrangement'
        Extras:
          type: array
          title: Extras
          items:
            $ref: '#/components/schemas/Extras'
        MultiMedia:
          type: array
          title: MultiMedia
          items:
            $ref: '#/components/schemas/MultiMedia'
      required:
        - AccommodationID
        - ArrivalDate
        - Duration
        - Unit
    AdditionalProducts:
      type: object
      properties:
        Extras:
          type: array
          title: Extras
          items:
            $ref: '#/components/schemas/Extras'
        TransportRental:
          type: array
          title: TransportRental
          items:
            $ref: '#/components/schemas/TransportRental'
    AgeCondition:
      title: Age Condition
      type: object
      properties:
        AgeType:
          $ref: '#/components/schemas/AgeType'
    APAssignment:
      type: object
      properties:
        ExtrasAssignment:
          type: array
          title: ExtrasAssignment
          items:
            $ref: '#/components/schemas/ExtrasAssignment'
        TRentalAssignment:
          type: array
          title: TRentalAssignment
          items:
            $ref: '#/components/schemas/TRentalAssignment'
    Arrangement:
      title: Arrangement
      type: object
      properties:
        ArrangementID:
          type: string
        Sequence:
          type: string
        Description:
          type: string
        ArrivalDate:
          type: string
          format: 'YYYY-MM-DD'
        Duration:
          $ref: '#/components/schemas/Duration'
        Allotment:
          type: integer
          format: int32
      required:
        - ArrangementID
        - Sequence
        - ArrivalDate
        - Duration
        - Allotment
    Arrival:
      type: object
      properties:
        Point:
          $ref: '#/components/schemas/Point'
        Date:
          type: string
          format: "YYYY-MM-DD"
        Time:
          $ref: '#/components/schemas/Time'
        DropOff:
          $ref: '#/components/schemas/DropOff'
      required:
        - Point
        - Date
    ArrivalInfo:
      type: object
      properties:
        Point:
          $ref: '#/components/schemas/Point'
        PriceNotes:
          type: array
          title: PriceNotes
          items:
            type: string
        ArrivalDay:
          type: array
          title: ArrivalDay
          items:
            $ref: '#/components/schemas/DutchDays'
      required:
        - Point
    Board:
      title: Board
      type: object
      properties:
        BoardType:
          $ref: '#/components/schemas/BoardType'
        Description:
          type: string
          title: Description
        PriceNotes:
          type: array
          items:
            $ref: '#/components/schemas/PriceNote'
      required:
        - BoardType
    BoardAssignment:
      type: object
      properties:
        BoardType:
          $ref: '#/components/schemas/BoardType'
        PaxID:
          type: array
          title: PaxID
          items:
            type: string
      required:
        - BoardType
    BookInfo:
      type: object
      properties:
        InvoiceID:
          type: string
        InvoiceDate:
          type: string
          format: 'YYYY-MM-DD'
        InvoiceStatus:
          type: string
        TravelDocumentsStatus:
          type: string
    CancellationInformation:
      type: object
      properties:
        Description:
          type: string
        Url:
          type: string
      required:
        - Description
    CancellationPolicy:
      type: object
      properties:
        CancellationPeriod:
          type: array
          title: CancellationPeriod
          items:
            type: object
            title: CancellationPeriod
            properties:
              CancellationPeriodDateTimeFrom:
                allOf:
                  - $ref: '#/components/schemas/DateAndTime'
                required:
                  - Date
                  - Time
              CancellationPeriodDateTimeTo:
                allOf:
                  - $ref: '#/components/schemas/DateAndTime'
                required:
                  - Date
                  - Time
              DescriptionField:
                type: string
              CancellationRate:
                type: integer
              CancellationFoundation:
                type: number
              CancellationAmmount:
                type: number
    Class:
      type: object
      properties:
        Tip:
          $ref: '#/components/schemas/ClassTip'
        ClassID:
          type: string
        Description:
          type: string
        Seats:
          type: number
        RequiredSeats:
          type: number
        Surcharge:
          type: object
          properties:
            Currency:
              $ref: '#/components/schemas/CurrencyType'
            Sign:
              $ref: '#/components/schemas/Sign'
        PriceNotes:
          type: string
        CancellationInformation:
          $ref: '#/components/schemas/CancellationInformation'
        PaxID:
          type: array
          title: PaxID
          items:
            type: string
      required:
        - ClassID
        - Seats
    Carrier:
      type: object
      properties:
        CarrierID:
          type: string
        Description:
          type: string
        FlightNumber:
          type: string
        Stopovers:
          type: object
          properties:
            NumberOfStops:
              type: number
              xml:
                attribute: true
            Stop:
              type: object
              properties:
                Index:
                  type: number
                  xml:
                    attribute: true
                Arrival:
                  allOf:
                    - $ref: '#/components/schemas/DateAndTime'
                  required:
                    - Date
                Departure:
                  allOf:
                    - $ref: '#/components/schemas/DateAndTime'
                  required:
                    - Date
                Point:
                  $ref: '#/components/schemas/Point'
                Checkin:
                  $ref: '#/components/schemas/YesNoValue'
                LeaveFlight:
                  $ref: '#/components/schemas/YesNoValue'
          required:
            - NumberOfStops
      required:
        - CarrierID
        - Stopovers
    Condition:
      allOf:
        - type: object
          oneOf:
            - title: NumberOfPersons
              properties:
                NumberOfPersons:
                  type: integer
                  format: int32
              required:
                - NumberOfPersons
            - title: AgeCondition
              properties:
                AgeCondition:
                  $ref: '#/components/schemas/AgeCondition'

    Contact:
      type: object
      properties:
        PaxID:
          type: string
        Initials:
          type: string
        Infix:
          type: string
        Name:
          type: string
        Gender:
          $ref: '#/components/schemas/Gender'
        Address:
          type: string
        Zipcode:
          type: string
        Place:
          type: string
        Country:
          type: string
        TelHome:
          type: string
        TelWork:
          type: string
        TelMobile:
          type: string
        Email:
          type: string
        BankAccount:
          type: string
      required:
        - Name
