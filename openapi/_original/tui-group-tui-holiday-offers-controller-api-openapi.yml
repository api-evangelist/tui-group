          type: integer
          format: int32
          description: No of piece of baggage allowance allowed
          example: 2
    WeightAllowance:
      type: object
      required:
        - value
      properties:
        value:
          type: integer
          format: int32
          description: Minimum weight allowed for baggage
          example: 2
        unit:
          type: string
          description: Unit in baggage weight defined.
          example: "KGN"
    DimensionAllowance:
      type: object
      required:
        - height
        - width
        - length
        - unit
      properties:
        height:
          type: integer
          format: int32
          description: Maximum height allowed for the baggage.
          example: 2
        width:
          type: integer
          format: int32
          description: Maximum width allowed for the baggage.
          example: 2
        length:
          type: integer
          format: int32
          description: Maximum length allowed for the baggage.
          example: 2
        unit:
          type: string
          description: Unit defined for dimension
          example: "cm"
    SSROptions:
      type: object
      properties:
        category:
          type: string
          enum:
            - BAGGAGE
            - SEATS
            - MEALS
            - ASSISTANCE
            - CABINS
            - SPORTS
            - ANIMAL
            - LOUNGE
            - MISC
        adultPrice:
          $ref: "#/components/schemas/MoneyV1"
        childPrice:
          $ref: "#/components/schemas/MoneyV1"
        weightAllowance:
          $ref: "#/components/schemas/WeightAllowance"
        applicableChildAge:
          type: number
          format: integer
          description: Child age which is applicable for child price
          example: 15
    PriceCalendarResponse:
      type: object
      required:
        - offers
      properties:
        offers:
          type: array
          items:
            $ref: "#/components/schemas/PriceOffersResponse"
    PriceOffersResponse:
      required:
        - productId
        - startDate
        - endDate
        - stay
        - flight
        - travellers
        - priceInfo
      type: object
      properties:
        productId:
          type: string
          description: product id for WR / atcom pkg id for NR
        startDate:
          type: string
          format: date
          description: start date of the package
          example: "2025-10-09"
        endDate:
          type: string
          format: date
          description: end date of the package
          example: "2025-10-16"
        stay:
          $ref: "#/components/schemas/PackageOfferStay"
        flight:
          type: array
          items:
            $ref: "#/components/schemas/PackageOfferFlightV1"
        transfers:
          type: array
          nullable: true
          description: This is currently only returned for WR as this is available only for NG services
          items:
            $ref: "#/components/schemas/TransferV1"
        travellers:
          type: array
          description: Travellers list for this room
          items:
            $ref: "#/components/schemas/TravellerV1"
        priceInfo:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PriceInfo"
        priceDetails:
          type: array
          items:
            $ref: "#/components/schemas/PriceDetails"
        isHandLuggageOnly:
          type: boolean
          description: Is this package with hand luggage only - currently available only for NR
          example: true
        extrasIncluded:
          $ref: "#/components/schemas/Extras"
        packageId:
          type: string
          deprecated: true
          description:
            id for the particular package for this unit - required only for NR |
            generation details https://confluence.tuigroup.com/pages/viewpage.action?spaceKey=ENGDO&title=Package+id+generation+logic
          example: "953925X810289616778016000001677801600000EZY238316784064000001678406400000EZY2384U00634421302486/3/426/7"
    Environment:
      type: string
      description: Environment which is used to get request / response from backend inventory
      enum:
        - hybdv1
        - hybdv2
        - hybdv3
        - hybdv4
        - hybdv5
        - hybdv6
        - hybdv7
        - hybdv8
        - hybdv9
        - hybdv10
        - st3
        - st5
        - pprd
        - prdsup
        - dev
        - sit
        - prod
