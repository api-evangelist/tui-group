paths:
  /api/nsk/v1/voucherIssuance:
    post:
      tags:
      - voucherIssuance
      summary: Creates vouchers based upon data in the request.
      description: 'This endpoint requires agent permissions.

        Note that creating high volume voucher issuance results in a batch job which may not process immediately.


        GraphQL endpoint: voucherIssuanceAdd'
      operationId: nsk_v1_voucherIssuance_post
      requestBody:
        x-name: request
        description: The voucher issuance request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoucherIssuanceRequest'
        required: true
        x-position: 1
      responses:
        '201':
          description: The item was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '400':
          description: There was a problem with the request and it could not be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
              examples:
                Agent not allowed to issue voucher:
                  description: Example response when issuing vouchers using an agent that is not allowed to issue vouchers.
                  value:
                    errors:
                    - id: null
                      code: nsk:VoucherIssuanceResponse:VoucherIssuanceFailed
                      message: nsk:VoucherIssuanceResponse:VoucherIssuanceFailed
                      type: Validation
                      details:
                        voucherConfigurationCode: VOUCH1
                        voucherWarningMessage: Agent is not authorized to create any vouchers.
                      rawMessage: The request to issue vouchers has failed. Check user permissions or see voucher configuration 'VOUCH1' to verify the voucher issuance requirements.
                      exception: null
                      debugMode: The API is currently running in debug mode. In production the 'rawMessage' and 'exception' nodes will not be returned. These are for troubleshooting development issues only.
                    data: null
                Voucher configuration restricted for the agent:
                  description: Example response when an agent issues vouchers under a restricted voucher configuration.
                  value:
                    errors:
                    - id: null
                      code: nsk:VoucherIssuanceResponse:VoucherIssuanceFailed
                      message: nsk:VoucherIssuanceResponse:VoucherIssuanceFailed
                      type: Validation
                      details:
                        voucherConfigurationCode: VOUCH2
                        voucherWarningMessage: Agent is not authorized to create vouchers with voucher basis code VOUCH2.
                      rawMessage: The request to issue vouchers has failed. Check user permissions or see voucher configuration 'VOUCH2' to verify the voucher issuance requirements.
                      exception: null
                      debugMode: The API is currently running in debug mode. In production the 'rawMessage' and 'exception' nodes will not be returned. These are for troubleshooting development issues only.
                    data: null
                Voucher configuration is disabled:
                  description: Example response when an agent issues vouchers under a disabled voucher configuration.
                  value:
                    errors:
                    - id: null
                      code: nsk:VoucherIssuanceResponse:VoucherIssuanceFailed
                      message: nsk:VoucherIssuanceResponse:VoucherIssuanceFailed
                      type: Validation
                      details:
                        voucherConfigurationCode: VOUCH3
                        voucherWarningMessage: Cannot create vouchers for disabled voucher basis (VOUCH3).
                      rawMessage: The request to issue vouchers has failed. Check user permissions or see voucher configuration 'VOUCH3' to verify the voucher issuance requirements.
                      exception: null
                      debugMode: The API is currently running in debug mode. In production the 'rawMessage' and 'exception' nodes will not be returned. These are for troubleshooting development issues only.
                    data: null
                With null request:
                  description: Example response when attempting to call the endpoint with null request
                  value:
                    errors:
                    - id: null
                      code: core:Validation:NullRequest
                      message: core:Validation:NullRequest
                      type: Error
                      details: null
                      rawMessage: The request is null or couldn't be converted to the expected data type.
                      exception: null
                      debugMode: The API is currently running in debug mode. In production the 'rawMessage' and 'exception' nodes will not be returned. These are for troubleshooting development issues only.
                    data: null
      deprecated: true
  /api/nsk/v2/voucherIssuance:
    post:
      tags:
      - voucherIssuance
      summary: Creates vouchers based upon data in the request.
      description: 'This endpoint requires agent permissions.

        Note that creating high volume voucher issuance results in a batch job which may not process immediately.


        GraphQL endpoint: voucherIssuanceAdd'
      operationId: nsk_v2_voucherIssuance_post
      requestBody:
        x-name: request
        description: The voucher issuance request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoucherIssuanceRequest'
            examples:
              Issue Voucher:
                description: Example request for issuing a voucher.
                value:
                  recordLocator: PNRPNR
                  firstName: John
                  lastName: Doe
                  personKey: MUNzPRfx
                  quantity: 1
                  customerNumber: '10000000000000000001'
                  sendFiles: true
                  ssrCode: WCHR
                  configurationCode: APIMKT
                  issuanceReasonCode: VRA
                  note: Voucher Issuance
                  market:
                    destination: BOS
                    origin: SLC
                    departureDate: '2026-07-09T05:55:14.5590145Z'
                    identifier: '5600'
                    carrierCode: NV
                    opSuffix: null
                  expiration: '2027-07-09T05:55:14.5590644Z'
                  currencyCode: USD
                  amount: 1.0
        required: true
        x-position: 1
      responses:
        '201':
          description: The item was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponseOfReducedVoucherResponse'
              examples:
                Create Voucher Successful:
                  description: Example when voucher is created successfully
                  value:
                    data:
                      references:
                      - '10000000000000000'
                      issuanceKey: Nzgz0TQhQ1JH
