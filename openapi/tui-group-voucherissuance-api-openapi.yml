                      rawMessage: The request to issue vouchers has failed. Check user permissions or see voucher configuration 'VOUCH1' to verify the voucher issuance requirements.
                      exception: null
                      debugMode: The API is currently running in debug mode. In production the 'rawMessage' and 'exception' nodes will not be returned. These are for troubleshooting development issues only.
                    data: null
                Voucher configuration restricted for the agent:
                  description: Example response when an agent issues vouchers under a restricted voucher configuration.
                  value:
                    errors:
                    - id: null
                      code: nsk:VoucherIssuanceResponse:VoucherIssuanceFailed
                      message: nsk:VoucherIssuanceResponse:VoucherIssuanceFailed
                      type: Validation
                      details:
                        voucherConfigurationCode: VOUCH2
                        voucherWarningMessage: Agent is not authorized to create vouchers with voucher basis code VOUCH2.
                      rawMessage: The request to issue vouchers has failed. Check user permissions or see voucher configuration 'VOUCH2' to verify the voucher issuance requirements.
                      exception: null
                      debugMode: The API is currently running in debug mode. In production the 'rawMessage' and 'exception' nodes will not be returned. These are for troubleshooting development issues only.
                    data: null
