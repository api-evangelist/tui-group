  /api/dcs/v3/baggage:
    post:
      tags:
      - baggage
      summary: Adds a list of bags to a booking.
      description: "Optional record locator determines whether this endpoint behaves statelessly or modifies the booking in state. \n    Including the record locator will add the bags statelessly without assigning any baggage group. \n    Omitting the record locator will add the bags to the booking in state, \n    assigning a baggage group for the specified passenger, \n    with any other passengers specified by otherPassengersAlternateKeys.\n\nGraphQL endpoint: dcsCreateBagsV3"
      operationId: dcs_v3_baggage_post
      requestBody:
        x-name: request
        description: List of bags to add
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaggageAddRequestV3'
        required: true
        x-position: 1
      responses:
        '201':
          description: List of bag keys added.
