      properties:
        recordLocator:
          type: string
          description: "The record locator.\n            "
          minLength: 1
        journeyKey:
          type: string
          description: "The journey key.\n            "
          minLength: 1
        passengerKey:
          type: string
          description: "The passenger key.\n            "
          minLength: 1
        baggageKey:
          type: string
          description: "The baggage key.\n            "
