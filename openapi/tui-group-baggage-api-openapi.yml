            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponseOfBaggageAddResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse_2'
        '401':
