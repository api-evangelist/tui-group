      type: integer
      description: 'Corresponds to what NewSkies calls the DocumentType (which is different from the

        DocumentTypeCode).


        0 = Unknown

        1 = AlienRegistrationCard

        2 = PermanentResidentCard

        3 = FacilitationDocument

        4 = InsPass

        5 = MilitaryId

        6 = Passport

        7 = ReEntryPermit

        8 = CreditCard

        9 = TravelVisa

        10 = OAFrequentFlyer

        11 = ParoleLetter

        12 = NoticeOfAction

