security:
- JWT: []
tags:
- name: scanners
paths:
  /api/dcs/v3/scanners/parse:
    post:
      tags:
      - scanners
      summary: 'Parses scanner output into individual data fields, returning one or more scan types

        based on the formats specified in the scan parser configuration.'
      description: 'GraphQL endpoint: dcsParseScannedDataV3'
      operationId: dcs_v3_scanners_parse_post
      requestBody:
        x-name: request
        description: Scanned data to parse.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseScanRequestV2'
        required: true
        x-position: 1
      responses:
        '200':
          description: Parsed scanned data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponseOfCombinedScanV3'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
components:
  schemas:
    BoardingPassLegV2:
      type: object
      additionalProperties: false
      properties:
        carrierCode:
          type:
          - string
          - 'null'
        flightNumber:
          type:
          - string
          - 'null'
        opSuffix:
          type:
          - string
          - 'null'
        origin:
          type:
          - string
          - 'null'
        destination:
          type:
          - string
          - 'null'
        departureTime:
          type: string
          format: date-time
        arrivalTime:
          type: string
          format: date-time
        boardingSequence:
          type: integer
        unitDesignator:
          type:
          - string
          - 'null'
          description: The assigned seat.
    BoardingPassScanV2:
      type: object
      additionalProperties: false
      properties:
        recordLocator:
          type:
          - string
          - 'null'
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
        departureDayOfMonth:
          type: integer
          description: 'Some boarding pass barcode formats only provide a day-of-month.  The first segment''s

            DepartureTime should be checked first, and if it is not set, then this should be used.'
          format: int32
        mobileBarcode:
          type:
          - string
          - 'null'
        segments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BoardingPassSegmentV2'
    BoardingPassSegmentV2:
      type: object
      additionalProperties: false
      properties:
        carrierCode:
