      type: object
      additionalProperties: false
      properties:
        carrierCode:
          type:
          - string
          - 'null'
        tierCode:
          type:
          - string
          - 'null'
        accountNumber:
          type:
          - string
          - 'null'
        expirationMonth:
          type:
          - string
          - 'null'
