          - string
          - 'null'
        flightNumber:
          type:
          - string
          - 'null'
        opSuffix:
          type:
          - string
          - 'null'
        origin:
          type:
          - string
          - 'null'
        destination:
          type:
          - string
          - 'null'
        departureTime:
          type: string
          format: date-time
        arrivalTime:
          type: string
          format: date-time
        legs:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BoardingPassLegV2'
    CreditCardScanV3:
      type: object
      additionalProperties: false
      properties:
        paymentMethodCode:
          type:
          - string
          - 'null'
        accountHolder:
          type:
          - string
          - 'null'
        accountNumber:
          type:
          - string
          - 'null'
        expirationMonth:
          type:
          - string
          - 'null'
        name:
          $ref: '#/components/schemas/Name'
    CombinedScanV3:
      type: object
      additionalProperties: false
      properties:
        bagTagScan:
          $ref: '#/components/schemas/BagTagScanV2'
        boardingPassScan:
          $ref: '#/components/schemas/BoardingPassScanV2'
        creditCardScan:
