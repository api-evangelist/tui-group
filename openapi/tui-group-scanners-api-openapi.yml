        deviceIdScan:
          type:
          - string
          - 'null'
        documentScan:
          $ref: '#/components/schemas/DocumentScanV2'
        itineraryScan:
          $ref: '#/components/schemas/ItineraryScanV2'
        membershipCardScan:
          $ref: '#/components/schemas/MembershipCardScanV3'
        recordLocatorScan:
          type:
          - string
          - 'null'
    Exception:
      type: object
      additionalProperties: false
      properties:
        Message:
          type: string
        InnerException:
          $ref: '#/components/schemas/Exception'
        Source:
          type:
          - string
          - 'null'
        StackTrace:
          type:
          - string
          - 'null'
    BagTagScanV2:
      type: object
      additionalProperties: false
      properties:
