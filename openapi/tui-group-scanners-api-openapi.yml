            type: string
        ActivityId:
          type:
          - string
          - 'null'
    DocumentV2:
      type: object
      additionalProperties: false
      properties:
        documentTypeCode:
          type:
          - string
          - 'null'
        group:
          description: 'Corresponds to what NewSkies calls the DocumentType (which is different from the

            DocumentTypeCode).'
          $ref: '#/components/schemas/DocumentGroup'
        issuingCountryCode:
          type:
          - string
          - 'null'
        documentDetails:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DataField'
    Message:
