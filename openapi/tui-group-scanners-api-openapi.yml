        14 = BorderCrossingCard

        15 = PilotLicense

        16 = USNaturalizationCertificate

        17 = RefugeeTravelDocument

        18 = GovernmentId

        19 = DriversLicense

        20 = RedressNumber

        21 = KnownTravelerId

        22 = FormOfId

        23 = Nexus

        24 = SecondaryExempt'
