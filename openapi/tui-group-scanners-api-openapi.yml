      additionalProperties: false
      properties:
        flightNumber:
          type:
          - string
          - 'null'
        origin:
          type:
          - string
          - 'null'
        destination:
          type:
          - string
          - 'null'
    DataField:
      type: object
      additionalProperties: false
      properties:
        data:
          type:
          - string
          - 'null'
        field:
          type:
          - string
          - 'null'
    MessageStatus:
      type: integer
      description: '0 = General

        1 = Warning

        2 = Critical'
      x-enumNames:
      - General
      - Warning
      - Critical
      enum:
      - 0
      - 1
      - 2
    DocumentScanV2:
      type: object
      additionalProperties: false
