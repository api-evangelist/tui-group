    get:
      tags:
      - booking/journeys
      summary: Gets the travel document requirements for a specific journey for the booking in-state.
      description: 'This endpoint will return a response containing a collection of travel document type codes that could fulfill

        a travel document requirement.  If the "AtLeastOneDocumentRequired" value is true, then one or more documents

        in the list are required.  However, it does not mean that every document in the list is required.  If

        "AtLeastOneDocumentRequired" is false, then the list of document type codes represents a list of acceptable

        travel documents, but nothing is required.

        This endpoint does not determine if any passengers already have required travel documents.


        GraphQL endpoint: travelDocumentRequirementsByKey'
      operationId: nsk_v1_booking_journeys_journeyKey_travelDocument_requirements_get
      parameters:
      - name: journeyKey
        in: path
        required: true
        description: The journey key to get required travel documents for.
        schema:
          type: string
        x-position: 1
      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponseOfTravelDocumentRequirements'
        '404':
          description: The item was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
