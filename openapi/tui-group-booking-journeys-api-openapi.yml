openapi: 3.2.0
info:
  title: NewSkies-Digital-Api Booking/journeys API
  version: 4.8.6.23
  description: Navitaire Digital Api
servers:
- url: https://prod.api.tui/flight/newskies/rest
  description: TUI Prod
- url: https://playground.api.tui/flight/newskies/rest
  description: TUI Playground
security:
- JWT: []
tags:
- name: booking/journeys
paths:
  /api/nsk/v1/booking/journeys:
    get:
      tags:
      - booking/journeys
      summary: Gets the collection of journeys on the booking in state.
      description: 'GraphQL endpoint: journeys'
      operationId: nsk_v1_booking_journeys_get
      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponseOfIListOfJourney'
        '404':
          description: The item was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
    delete:
      tags:
      - booking/journeys
      summary: Cancels all the journeys on the current booking in state.
      description: 'This endpoint also cancels all booking components/add-ons.

        To only cancel journeys, use DELETE /api/nsk/v1/booking/journeys/{journeyKey}.

        IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.


        GraphQL endpoint: journeyDeleteAll'
      operationId: nsk_v1_booking_journeys_delete
      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '400':
          description: There was a problem with the request and it could not be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '403':
          description: Role permissions are not met.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '409':
          description: Concurrent changes were being made in the same session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
  /api/nsk/v1/booking/journeys/{journeyKey}:
    get:
      tags:
      - booking/journeys
      summary: Gets a single journey by the key.
      description: 'GraphQL endpoint: journey'
      operationId: nsk_v1_booking_journeys_journeyKey_get
      parameters:
      - name: journeyKey
        in: path
        required: true
        description: The journey key to be retrieved.
        schema:
          type: string
        x-position: 1
      responses:
        '200':
          description: Ok.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponseOfJourney'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
    delete:
      tags:
      - booking/journeys
      summary: Cancels the specific journey from the booking in state.
      description: '`IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.`


        GraphQL endpoint: journeyDelete'
      operationId: nsk_v1_booking_journeys_journeyKey_delete
      parameters:
      - name: journeyKey
        in: path
        required: true
        description: The journey key to be canceled.
        schema:
          type: string
        x-position: 1
      requestBody:
        x-name: request
        description: The cancel journey request options.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelJourneyRequest'
        required: true
        x-position: 2
      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '400':
          description: There was a problem with the request and it could not be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '403':
          description: Role permissions are not met.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '409':
          description: Concurrent changes were being made in the same session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
  /api/nsk/v1/booking/journeys/{journeyKey}/bundles:
    delete:
      tags:
      - booking/journeys
      summary: Removes the add-on service bundles of the requested passengers in the given journey.
      description: 'This endpoint does not support removal of included bundles.

        IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.


        GraphQL endpoint: bundleDelete'
      operationId: nsk_v1_booking_journeys_journeyKey_bundles_delete
      parameters:
      - name: journeyKey
        in: path
        required: true
        description: The journey key.
        schema:
          type: string
        x-position: 1
      requestBody:
        x-name: passengersKeys
        description: The passengers to remove bundles from.
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
        x-position: 2
      responses:
        '404':
          description: The item was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '409':
          description: Concurrent changes were being made in the same session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
  /api/nsk/v2/booking/journeys/{journeyKey}/bundles:
    post:
      tags:
      - booking/journeys
      summary: Sells a service bundle for one or more passengers on a journey.
      description: '`IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.`


        GraphQL endpoint: bundleSellv2'
      operationId: nsk_v2_booking_journeys_journeyKey_bundles_post
      parameters:
      - name: journeyKey
        in: path
        required: true
        description: The journey key.
        schema:
          type: string
        x-position: 1
      requestBody:
        x-name: request
        description: The bundle sell request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BundleSellRequest'
        required: true
        x-position: 2
      responses:
        '201':
          description: The item was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
              examples:
                With Already Booked SSR or Bundle:
                  description: Example OSI Message if passenger already booked an SSR or bundle
                  value:
                    messages:
                    - rawValue: '[HMC] cannot be sold because passenger 0 already booked [THCS] on NV3075  YTZ-LAX.'
                      code: CannotSellBundleSSR
                      debugMode: The API is currently running in debug mode. In production the 'rawValue' node will not be returned. These are for troubleshooting development issues only.
                      type: CannotSellBundleSSR
                      value: CannotSellBundleSSR
                      status: 0
                      details:
                        cannotSellBundleSSRMessage: '[HMC] cannot be sold because passenger 0 already booked [THCS] on NV3075  YTZ-LAX.'
                    data: null
                With Cannot Find Interchangeable Bundle SSR:
                  description: Example OSI Message if cannot find interchangeable bundle SSR in state
                  value:
                    messages:
                    - rawValue: Cannot find interchangeable bundle SSR for [HMC] in state.
                      code: CannotSellBundleSSR
                      debugMode: The API is currently running in debug mode. In production the 'rawValue' node will not be returned. These are for troubleshooting development issues only.
                      type: CannotSellBundleSSR
                      value: CannotSellBundleSSR
                      status: 0
                      details:
                        cannotSellBundleSSRMessage: Cannot find interchangeable bundle SSR for [HMC] in state.
                    data: null
                With SSR Not Found in Service Bundle:
                  description: Example OSI Message if an SSR is not found in service bundle
                  value:
                    messages:
                    - rawValue: SSR [HMC] not found in service bundle.
                      code: CannotSellBundleSSR
                      debugMode: The API is currently running in debug mode. In production the 'rawValue' node will not be returned. These are for troubleshooting development issues only.
                      type: CannotSellBundleSSR
                      value: CannotSellBundleSSR
                      status: 0
                      details:
                        cannotSellBundleSSRMessage: SSR [HMC] not found in service bundle.
                    data: null
                With Duplicate SSR or Bundle:
                  description: Example OSI Message if duplicate SSR or Bundle
                  value:
                    messages:
                    - rawValue: Duplicate SSR [THCS] in SAN-YTZ is not allowed for service bundle.
                      code: CannotSellBundleSSR
                      debugMode: The API is currently running in debug mode. In production the 'rawValue' node will not be returned. These are for troubleshooting development issues only.
                      type: CannotSellBundleSSR
                      value: CannotSellBundleSSR
                      status: 0
                      details:
                        cannotSellBundleSSRMessage: Duplicate SSR [THCS] in SAN-YTZ is not allowed for service bundle.
                    data: null
        '409':
          description: Concurrent changes were being made in the same session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
  /api/nsk/v1/booking/journeys/{journeyKey}/fees/penalty:
    delete:
      tags:
      - booking/journeys
      summary: Waives the penalty fee of the specified journey.
      description: 'Waiving the penalty fee is configurable. See the "Fee and Tax Settings", "Single Penalty Fee" option. If this is

        checked and configured this endpoint will waive the penalty fees from all journeys in the booking in state.

        IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.


        GraphQL endpoint: journeyPenaltyFeeDelete'
      operationId: nsk_v1_booking_journeys_journeyKey_fees_penalty_delete
      parameters:
      - name: journeyKey
        in: path
        required: true
        description: The journey key.
        schema:
          type: string
        x-position: 1
      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '409':
          description: Concurrent changes were being made in the same session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
  /api/nsk/v1/booking/journeys/{journeyKey}/passengers/{passengerKey}/address/requirements:
    get:
      tags:
      - booking/journeys
      summary: 'Gets the passenger or associated infant''s destination address requirements for a specific journey for the booking

        in-state.'
      description: 'This endpoint will determine if the passenger or the associated infant requires a destination address for the

        given journey.

        This does not determine if the passenger already has a qualifying address, only if the destination address

        is required.


        GraphQL endpoint: destinationAddressRequirementsByKey'
      operationId: nsk_v1_booking_journeys_journeyKey_passengers_passengerKey_address_requirements_get
      parameters:
      - name: journeyKey
        in: path
        required: true
        description: The journey key to check requirements for.
        schema:
          type: string
        x-position: 1
      - name: passengerKey
        in: path
        required: true
        description: The passenger key to check requirements for.
        schema:
          type: string
        x-position: 2
      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponseOfBoolean'
        '404':
          description: The item was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
  /api/nsk/v1/booking/journeys/{journeyKey}/passengers/{passengerKey}/baggage:
    get:
      tags:
      - booking/journeys
      summary: Gets all baggage for a passenger on a specific journey.
      description: 'GraphQL endpoint: passengerBagJourneys'
      operationId: nsk_v1_booking_journeys_journeyKey_passengers_passengerKey_baggage_get
      parameters:
      - name: journeyKey
        in: path
        required: true
        description: The journey key for the journey to retrieve from.
        schema:
          type: string
        x-position: 1
      - name: passengerKey
        in: path
        required: true
        description: The passenger key for the passenger to retrieve from.
        schema:
          type: string
        x-position: 2
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponseOfIListOfPassengerBag'
        '404':
          description: Baggage was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
    post:
      tags:
      - booking/journeys
      summary: Adds baggage to the booking.
      description: 'This call must be followed by a commit to see the bags added in state.

        IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.


        GraphQL endpoint: passengerBagAdd'
      operationId: nsk_v1_booking_journeys_journeyKey_passengers_passengerKey_baggage_post
      parameters:
      - name: journeyKey
        in: path
        required: true
        description: The unique identifier for the journey to add to.
        schema:
          type: string
        x-position: 1
      - name: passengerKey
        in: path
        required: true
        description: The specific passenger key.
        schema:
          type: string
        x-position: 2
      requestBody:
        x-name: request
        description: A request to add bags to the given passenger.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassengerBagRequest'
        required: true
        x-position: 3
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '409':
          description: Concurrent changes were being made in the same session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
  /api/nsk/v1/booking/journeys/{journeyKey}/passengers/{passengerKey}/baggage/{baggageKey}:
    get:
      tags:
      - booking/journeys
      summary: Gets a single bag from a passenger on a journey.
      description: 'GraphQL endpoint: passengerBagJourney'
      operationId: nsk_v1_booking_journeys_journeyKey_passengers_passengerKey_baggage_baggageKey_get
      parameters:
      - name: journeyKey
        in: path
        required: true
        description: The journey key for the journey to retrieve from.
        schema:
          type: string
        x-position: 1
      - name: passengerKey
        in: path
        required: true
        description: The passenger key for the passenger to retrieve from.
        schema:
          type: string
        x-position: 2
      - name: baggageKey
        in: path
        required: true
        description: The bag key for the bag to retrieve.
        schema:
          type: string
        x-position: 3
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponseOfPassengerBag'
        '404':
          description: Bag was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
    put:
      tags:
      - booking/journeys
      summary: Checks-in the baggage for a passenger on the booking in state.
      description: 'This is to be called after a stateful adding of baggage to a booking and a commit must follow

        the completion of this in order to see the bag checked in.

        Also, this call properly syncs with baggage allowances and usages once completed.

        IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.


        GraphQL endpoint: passengerBagCheckIn'
      operationId: nsk_v1_booking_journeys_journeyKey_passengers_passengerKey_baggage_baggageKey_put
      parameters:
      - name: journeyKey
        in: path
        required: true
        description: The journey key.
        schema:
          type: string
        x-position: 1
      - name: passengerKey
        in: path
        required: true
        description: The passenger key.
        schema:
          type: string
        x-position: 2
      - name: baggageKey
        in: path
        required: true
        description: The baggage key.
        schema:
          type: string
        x-position: 3
      requestBody:
        x-name: request
        description: The baggage check-in request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassengerBagCheckInRequest'
        required: true
        x-position: 4
      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '500':
          description: A server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '409':
          description: Concurrent changes were being made in the same session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
      deprecated: true
    delete:
      tags:
      - booking/journeys
      summary: Removes baggage from the booking.
      description: '`IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.`


        GraphQL endpoint: passengerBagDelete'
      operationId: nsk_v1_booking_journeys_journeyKey_passengers_passengerKey_baggage_baggageKey_delete
      parameters:
      - name: journeyKey
        in: path
        required: true
        description: The unique identifier for the journey to remove from.
        schema:
          type: string
        x-position: 1
      - name: passengerKey
        in: path
        required: true
        description: The specific passenger key.
        schema:
          type: string
        x-position: 2
      - name: baggageKey
        in: path
        required: true
        description: Unique identifier for the bag to remove.
        schema:
          type: string
        x-position: 3
      responses:
        '200':
          description: Ok.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '409':
          description: Concurrent changes were being made in the same session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
  /api/nsk/v2/booking/journeys/{journeyKey}/passengers/{passengerKey}/baggage/{baggageKey}:
    put:
      tags:
      - booking/journeys
      summary: Updates the baggage for a passenger on the booking in state.
      description: 'This is to be called after a stateful adding of baggage to a booking and a commit must follow

        the completion of this in order to see the bag checked in.

        This call does NOT sync with baggage allowances and usages.

        IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.


        GraphQL endpoint: passengerBagSet'
      operationId: nsk_v2_booking_journeys_journeyKey_passengers_passengerKey_baggage_baggageKey_put
      parameters:
      - name: journeyKey
        in: path
        required: true
        description: The journey key.
        schema:
          type: string
        x-position: 1
      - name: passengerKey
        in: path
        required: true
        description: The passenger key.
        schema:
          type: string
        x-position: 2
      - name: baggageKey
        in: path
        required: true
        description: The baggage key.
        schema:
          type: string
        x-position: 3
      requestBody:
        x-name: request
        description: The baggage update request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassengerBagUpdateRequest'
        required: true
        x-position: 4
      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '400':
          description: There was a problem with the request and it could not be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
              examples:
                With Invalid Baggage Key:
                  description: Example Error if baggage key is invalid.
                  value:
                    errors:
                    - id: null
                      code: nsk:Exceptions:InvalidKey
                      message: nsk:Exceptions:InvalidKey
                      type: Validation
                      details:
                        baggageKey: MDAyODAzMDg0MQ--
                      rawMessage: The identifier 'BaggageKey' with value 'MDAyODAzMDg0MQ--' is invalid.
                      exception: null
                      debugMode: The API is currently running in debug mode. In production the 'rawMessage' and 'exception' nodes will not be returned. These are for troubleshooting development issues only.
                    data: null
                Update Failed Exception:
                  description: Example error if the update failed.
                  value:
                    errors:
                    - id: null
                      code: nsk:Exceptions:UpdateFailed
                      message: nsk:Exceptions:UpdateFailed
                      type: Validation
                      details: null
                      rawMessage: Attempted update of object PassengerBagUpdateRequest has failed. Please verify this object exists.
                      exception: null
                      debugMode: The API is currently running in debug mode. In production the 'rawMessage' and 'exception' nodes will not be returned. These are for troubleshooting development issues only.
                    data: null
  /api/nsk/v1/booking/journeys/{journeyKey}/passengers/{passengerKey}/baggage/{baggageKey}/checkin:
    put:
      tags:
      - booking/journeys
      summary: Checks in the baggage for a passenger on the booking in state.
      description: 'This is to be called after a stateful adding of baggage to a booking and a commit must follow

        the completion of this in order to see the bag checked in.

        Also, this call properly syncs with baggage allowances and usages once completed.

        IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.


        GraphQL endpoint: passengerBagCheckIn'
      operationId: nsk_v1_booking_journeys_journeyKey_passengers_passengerKey_baggage_baggageKey_checkin_put
      parameters:
      - name: journeyKey
        in: path
        required: true
        description: The journey key.
        schema:
          type: string
        x-position: 1
      - name: passengerKey
        in: path
        required: true
        description: The passenger key.
        schema:
          type: string
        x-position: 2
      - name: baggageKey
        in: path
        required: true
        description: The baggage key.
        schema:
          type: string
        x-position: 3
      requestBody:
        x-name: request
        description: The baggage check-in request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassengerBagCheckInRequest'
        required: true
        x-position: 4
      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '400':
          description: There was a problem with the request and it could not be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
              examples:
                With Invalid Baggage Key:
                  description: Example Error if baggage key is invalid.
                  value:
                    errors:
                    - id: null
                      code: nsk:Exceptions:InvalidKey
                      message: nsk:Exceptions:InvalidKey
                      type: Validation
                      details:
                        baggageKey: MDAyODAzMDg0MQ--
                      rawMessage: The identifier 'BaggageKey' with value 'MDAyODAzMDg0MQ--' is invalid.
                      exception: null
                      debugMode: The API is currently running in debug mode. In production the 'rawMessage' and 'exception' nodes will not be returned. These are for troubleshooting development issues only.
                    data: null
                Baggage Checkin Failed:
                  description: If baggage check-in failed.
                  value:
                    errors:
                    - id: null
                      code: nsk:Baggage:BaggageCheckinFailed
                      message: nsk:Baggage:BaggageCheckinFailed
                      type: Error
                      details: null
                      rawMessage: The baggage check-in for the booking in state failed.
                      exception: null
                      debugMode: The API is currently running in debug mode. In production the 'rawMessage' and 'exception' nodes will not be returned. These are for troubleshooting development issues only.
                    data: null
  /api/nsk/v1/booking/journeys/{journeyKey}/passengers/{passengerKey}/baggage/group:
    put:
      tags:
      - booking/journeys
      summary: Moves passenger to a different baggage group.
      description: 'Passengers in the same baggage group may share baggage allowances,

        enabling baggage allowance pooling.

        `PassengerBagGroupRequest.BaggageGroupNumber` only accepts bag group numbers

        from existing passenger bag group numbers. Passenger bag group number is

        exposed under passenger segment. If set to null, the passenger will be moved

        to a new bag group.

        IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.


        GraphQL endpoints: passengerBagGroupSet, passengerBagGroupSetBatch'
      operationId: nsk_v1_booking_journeys_journeyKey_passengers_passengerKey_baggage_group_put
      parameters:
      - name: journeyKey
        in: path
        required: true
        description: The journey key.
        schema:
          type: string
        x-position: 1
      - name: passengerKey
        in: path
        required: true
        description: The passenger key.
        schema:
          type: string
        x-position: 2
      requestBody:
        x-name: request
        description: The passenger bag group request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassengerBagGroupRequest'
        required: true
        x-position: 3
      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '500':
          description: A server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '409':
          description: Concurrent changes were being made in the same session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
  /api/nsk/v1/booking/journeys/{journeyKey}/passengers/{passengerKey}/baggage/manual:
    post:
      tags:
      - booking/journeys
