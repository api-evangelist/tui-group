security:
- JWT: []
tags:
- name: organizations2
paths:
  /api/nsk/v1/organizations2:
    post:
      tags:
      - organizations2
      summary: Create a new organization.
      description: 'Requires agent permissions.

        The organization code is a generic code for all of the organization types. Each individual type has its own code

        and validation.

        If the organization status is not pending the organization code should follow these validation rules based on type:

        Third Party: 3 to 10 characters in length with alphanumeric values.

        Travel Agency: 7 to 10 characters in length with numeric values.

        Carrier: 2 to 3 characters in length with alphanumeric values.

        If no organization code is provided then one will be generated and returned on the header.


        GraphQL endpoint: organizationAdd'
      operationId: nsk_v1_organizations2_post
      requestBody:
        x-name: createRequest
        description: The request for creating the new organization.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreateRequest'
        required: true
        x-position: 1
      responses:
        '201':
          description: The item was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
  /api/nsk/v2/organizations2:
    get:
      tags:
      - organizations2
      summary: Searches for organizations.
      description: 'GraphQL endpoint: organizations2v2'
      operationId: nsk_v2_organizations2_get
      parameters:
      - name: OrganizationCode
        in: query
        description: "The organization code.\n            "
        schema:
          type:
          - string
          - 'null'
          maxLength: 10
          minLength: 2
        x-position: 1
      - name: Type
        in: query
        description: "Organization type.\n             \nEnumeration values: 0 = Default, 1 = Master, 2 = Carrier, 3 = TravelAgency, 4 = ThirdParty"
        schema:
          $ref: '#/components/schemas/OrganizationType'
        x-position: 2
      - name: Status
        in: query
        description: "The organization status.\n             \nEnumeration values: 0 = Default, 1 = Active, 2 = Cancelled, 3 = Pending"
        schema:
          $ref: '#/components/schemas/OrganizationStatus'
        x-position: 3
      - name: ParentOrganizationCode
        in: query
        description: "The parent organization code.\n            "
        schema:
          type:
          - string
          - 'null'
          maxLength: 10
          minLength: 2
        x-position: 4
      - name: CompanyName
        in: query
        description: "The organization company name.\n            "
        schema:
          type:
          - string
          - 'null'
        x-position: 5
      - name: City
        in: query
        description: "The organization company city.\n            "
        schema:
          type:
          - string
          - 'null'
          maxLength: 32
          minLength: 0
        x-position: 6
      - name: PostalCode
        in: query
        description: "The organization company postal code.\n            "
        schema:
          type:
          - string
          - 'null'
          maxLength: 10
          minLength: 0
        x-position: 7
      - name: PagedItemIndex
        in: query
        description: "Used to specify the index for skipping values when paging.\n            "
        schema:
          type:
          - integer
          - 'null'
          format: int64
          maximum: 9.223372036854776e+18
          minimum: 1.0
        x-position: 8
      - name: PageSize
        in: query
        description: "Used to specify the maximum results to return.\n            "
        schema:
          type:
          - integer
          - 'null'
          maximum: 5000.0
          minimum: 1.0
        x-position: 9
      - name: MatchCriteria.OrganizationCode
        in: query
        description: "The type of string search for organization code.\n             \nEnumeration values: 0 = StartsWith, 1 = EndsWith, 2 = Contains, 3 = ExactMatch"
        schema:
          $ref: '#/components/schemas/MatchCriteria'
        x-position: 10
      - name: MatchCriteria.ParentOrganizationCode
        in: query
        description: "The  type of string search for parent organization code.\n             \nEnumeration values: 0 = StartsWith, 1 = EndsWith, 2 = Contains, 3 = ExactMatch"
        schema:
          $ref: '#/components/schemas/MatchCriteria'
        x-position: 11
      - name: MatchCriteria.CompanyName
        in: query
        description: "The  type of string search for organization company name.\n             \nEnumeration values: 0 = StartsWith, 1 = EndsWith, 2 = Contains, 3 = ExactMatch"
        schema:
          $ref: '#/components/schemas/MatchCriteria'
        x-position: 12
      - name: MatchCriteria.City
        in: query
        description: "The  type of string search for organization company city.\n             \nEnumeration values: 0 = StartsWith, 1 = EndsWith, 2 = Contains, 3 = ExactMatch"
        schema:
          $ref: '#/components/schemas/MatchCriteria'
        x-position: 13
      - name: MatchCriteria.PostalCode
        in: query
        description: "The  type of string search for organization company postal code.\n             \nEnumeration values: 0 = StartsWith, 1 = EndsWith, 2 = Contains, 3 = ExactMatch"
        schema:
          $ref: '#/components/schemas/MatchCriteria'
        x-position: 14
      responses:
        '404':
          description: The item was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponseOfIListOfOrganizationRecord'
