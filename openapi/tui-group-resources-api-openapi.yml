    get:
      tags:
      - resources
      summary: Retrieves the collection of external rate resources.
      description: 'The external rates cache expiration is configurable as a number of minutes past the hour to expire.  This

        should allow for better alignment with third party external rates providers'' recommendations, which typically

        state that external rates cache items should expire 5-7 minutes past the hour.  This can be configured in

        the NskSystemOptions.ExternalRatesExpiration.  If no value is set, the API will default to five minutes

        past the hour.

        If the value "Enable External Currency Conversion" is disabled in SkyPay, external rates won''t be returned

        by this call.

        Additionally, there are some edge cases where the cache entry expiration is created at or close to the configured

        expiration time.  In these cases, an additional two minutes will be added to the cache expiration.

        For example, if the configured external rate cache expiration is for five minutes after the hour, and the current

        time is 12:04, the expiration will be 12:07 instead of 12:05.  This gives the cached item enough time to get set

        into cache, but will expire quickly in order to refresh according to third party external rates providers'' cache

        requirements (refresh at 5-7 minutes past the hour).


