components:
  schemas:
    ValidateHolidayRequest:
      type: object
      required:
      - InfoBookingRequest
      properties:
        InfoBookingRequest:
          $ref: '#/components/schemas/InfoBookingRequest'
    ValHolidayResponseHotelProduct:
      type: object
      required:
      - Name
      - Acc_Cd
      properties:
        HtlPrd:
          type: object
          properties:
            Name:
              type: string
              example: Highlights of the Mediterranean (Discovery 2)
              description: Product name
            Prom:
              type: object
              properties:
                Code:
                  type: string
                  example: CGCR
                  description: Promotion code
                Issue:
                  type: integer
                  example: 1
                  description: Issue number
                Name:
                  type: string
                  example: Marella Cruises
                  description: Promotion name
                Brand:
                  type: string
                  example: 'NULL'
                  description: Brand information
                TEXT:
                  type: string
                  example: 'NULL'
                  description: Additional text information
            Acc_Cd:
              type: object
              properties:
                Accom_Id:
                  type: string
                  example: 1174396007/3
                  description: Accommodation ID
                TEXT:
                  type: string
                  example: XXXX0013/025
                  description: Accommodation code text
            Acc_InvState:
              type: string
              example: INTERNAL
              description: Accommodation inventory state
            Hotel:
              type: object
              properties:
                Add:
                  type: object
                  properties:
                    Name:
                      type: string
                      example: Highlights of the Mediterranean (Discovery 2)
                      description: Hotel name
                    City:
                      type: string
                      example: Palma Port
                      description: City name
                    Region:
                      type: string
                      example: Majorca
                      description: Region name
                    CountryISOCode:
                      type: string
                      example: ES
                      description: Country ISO code
                Comm:
                  type: object
                  properties:
                    CommType:
                      type: string
                      example: TYPE_PHONE
                      description: Communication type
                    Sphere:
                      type: string
                      example: SPHERE_BUSINESS
                      description: Communication sphere
                    AreaCode:
                      type: string
                      example: 'NULL'
                      description: Area code
                    Num:
                      type: string
                      example: 01234567890
                      description: Phone number
                Loc:
                  type: object
                  properties:
                    Loc_Cd:
                      type: string
                      example: ESMJPB
                      description: Location code
                    Loc_Tp:
                      type: string
                      example: CITY
                      description: Location type
                    Loc_Name:
                      type: string
                      example: Palma Port
                      description: Location name
            Cat_Page:
              type: object
              properties:
                Catalog:
                  type: object
                  properties:
                    Code:
                      type: string
                      example: GCR
                      description: Catalog code
                    Name:
                      type: string
                      example: Marella Cruises UK NEW
                      description: Catalog name
                    TEXT:
                      type: string
                      example: 'NULL'
                      description: Additional text information
                Cat_Page_No:
                  type: integer
                  example: 0
                  description: Catalog page number
                Prc_Cat_Page_No:
                  type: integer
                  example: 0
                  description: Price catalog page number
            Ship_Cd:
              type: string
              example: XXXX0013
              description: Ship code
            Ship_Name:
              type: string
              example: Marella Discovery 2
              description: Ship name
            Corporate_Cd:
              type: integer
              example: 101752
              description: Corporate code
            Sub_Corporate_Cd:
              type: string
              example: 'NULL'
              description: Sub-corporate code
    ValHolidayRequestSec:
      type: object
      required:
      - Dep_Air_Cd
      - Arr_Air_Cd
      - Flt_Dt_Tm
      - Car_Cd
      properties:
        Dep_Air_Cd:
          type: string
          description: Departure airport code (IATA code)
          example: LGW
        Arr_Air_Cd:
          type: string
          description: Arrival airport code (IATA code)
          example: PMI
        Flt_Dt_Tm:
          type: array
          description: Flight date and time information
          items:
            $ref: '#/components/schemas/ValHolidayRequestFlight_DateTime'
        Car_Cd:
          type: string
          description: Carrier code
          example: TOM
        Flt_No:
          type: string
          description: Flight number
          example: '4230'
    ValHolidayResponseRoute_List:
      type: object
      required:
      - Routing
      properties:
        Routing:
          $ref: '#/components/schemas/ValHolidayResponseRouting'
    SubServicePassengers:
      type: object
      properties:
        SubServPax:
          type: array
          description: List of passengers for this service
          items:
            $ref: '#/components/schemas/SubServicePassenger'
    ValHolidayRequestSource:
      type: object
      required:
      - '#attrs'
      properties:
        '#attrs':
          type: object
          required:
          - Cd
          properties:
            Cd:
              type: string
              description: Source code
              example: AGEN
    Person:
      type: object
      required:
      - FirstName
      - LastName
      - Title
      - Sex
      - PersonType
      properties:
        FirstName:
          type: string
          description: First name of the passenger
          example: TEST
        LastName:
          type: string
          description: Last name of the passenger
          example: PASSENGER
        Title:
          type: string
          description: Title of the passenger
          example: Mr
        Sex:
          type: string
          description: Gender of the passenger
          enum:
          - SEX_MALE
          - SEX_FEMALE
          example: SEX_MALE
        PersonType:
          type: string
          description: Type of person
          enum:
          - TYPE_NATURAL
          example: TYPE_NATURAL
    Item:
      type: array
      description: List of additional items in the booking
      items:
        $ref: '#/components/schemas/Item_Element'
    Summary_Prices:
      type: object
      properties:
        Summary_Price:
          type: array
          items:
            type: object
            properties:
              Prc_Tp_Cd:
                type: string
                example: ACRMAD
                description: Price type code
              Prc_Tp_Name:
                type: string
                example: Adult Package Price
                description: Price type name
              Qty:
                type: integer
                example: 2
                description: Quantity
              Prc:
                type: number
                format: float
                example: 2075.0
                description: Price amount
    ValHolidayRequestSub_Source:
      type: object
      required:
      - '#attrs'
      properties:
        '#attrs':
          type: object
          required:
          - Cd
          properties:
            Cd:
              type: string
              description: Sub-source code
              example: ZWEB
    ValHolidayResponseRouting:
      type: object
      required:
      - Routing_Id
      - Route
      properties:
        Routing_Id:
          type: string
          description: Routing identifier
          example: '2'
        Route:
          type: array
          description: List of routes
          items:
            $ref: '#/components/schemas/ValHolidayResponseRoute'
    ValHolidayRequestAdm:
      type: object
      properties:
        ReqId:
          type: string
          description: Request identifier
          example: node1-6eaY7EbD
    ValHolidayRequestMultiCentre:
      type: object
      required:
      - id
      - stDt
      - endDt
      - mcPrd
      - rmCd
      properties:
        Id:
          type: string
          description: Multi-center identifier
          example: '1'
        St_Dt:
          type: string
          format: date
          description: Start date
          example: '2026-08-04'
        End_Dt:
          type: string
          format: date
          description: End date
          example: '2026-08-18'
        MC_Prd:
          $ref: '#/components/schemas/ValHolidayRequestMultiCentreProduct'
        Rm_Cd:
          $ref: '#/components/schemas/RoomCode'
        Offer_Choice:
          type: array
          description: List of accommodation offers
          items:
            $ref: '#/components/schemas/ValHolidayRequestOfferChoice'
        '#attrs':
          type: object
          properties:
            Is_Adhoc:
              type: string
              description: Multi-center identifier
              example: 'false'
    Prices:
      type: object
      properties:
        Price:
          type: array
          items:
            type: object
            properties:
              Prc_Cd:
                type: string
                example: AA
                description: Price code
              Prc_Cd_Name:
                type: string
                example: Adult Package Price
                description: Price code name
              Prc_Cd_Tp:
                type: string
                example: ACRMAD
                description: Price code type
              Qty:
                type: integer
                example: 2
