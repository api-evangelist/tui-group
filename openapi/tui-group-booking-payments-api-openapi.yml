  /api/nsk/v1/booking/payments/voucher/reassess:
    put:
      tags:
      - booking/payments
      summary: 'Reassess the voucher payments on the current booking in state.

        This will reverse non-adjustable voucher payments to balance the voucher when the booking is overpaid.

        The use of the voucher is not considered in the reassessment of a non-adjustable voucher payment.

        Multi-use without adjustment vouchers will be prioritized over single-use without adjustment vouchers.

        Vouchers with a longer expiration date will also be prioritized. The voucher type will be honored first and then

        the expiration date.'
      description: 'IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.


        GraphQL endpoint: paymentVouchersReassess'
