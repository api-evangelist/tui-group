      - CreditCard
      - TravelVisa
      - OAFrequentFlyer
      - ParoleLetter
      - NoticeOfAction
      - TransportationLetter
      - BorderCrossingCard
      - PilotLicense
      - USNaturalizationCertificate
      - RefugeeTravelDocument
      - GovernmentId
      - DriversLicense
      - RedressNumber
      - KnownTravelerId
      - FormOfId
      - Nexus
      - SecondaryExempt
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
