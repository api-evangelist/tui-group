      - 13
      - 14
    GovernmentProgramType:
      type: integer
      description: '0 = None

        1 = Aqq

        2 = SecureFlight

        3 = Apps

        4 = Apis

        5 = Iapp

        6 = Eub

        7 = Iatci

        8 = DocCheck

        9 = DocsOnly

        10 = Pnrgov

        11 = DigiYatra

        12 = Pfms'
      x-enumNames:
      - None
      - Aqq
      - SecureFlight
      - Apps
      - Apis
      - Iapp
      - Eub
      - Iatci
      - DocCheck
      - DocsOnly
      - Pnrgov
      - DigiYatra
      - Pfms
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
