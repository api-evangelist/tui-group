      - 24
    LegStatus:
      type: integer
      description: '0 = Blocked

        1 = Boarding

        2 = BoardingClosedPending

        3 = Canceled

        4 = Delayed

        5 = Departed

        6 = DepartedClosed

        7 = DepartedClosedPending

        8 = OnTime

        9 = Closed

        10 = OnTimeClosedPending

        11 = Early

        12 = Suspended

        13 = EarlyClosedPending

        14 = DelayedClosedPending'
      x-enumNames:
      - Blocked
      - Boarding
      - BoardingClosedPending
      - Canceled
      - Delayed
      - Departed
      - DepartedClosed
      - DepartedClosedPending
      - OnTime
      - Closed
      - OnTimeClosedPending
      - Early
      - Suspended
      - EarlyClosedPending
      - DelayedClosedPending
      enum:
      - 0
