        6 = Passport

        7 = ReEntryPermit

        8 = CreditCard

        9 = TravelVisa

        10 = OAFrequentFlyer

        11 = ParoleLetter

        12 = NoticeOfAction

        13 = TransportationLetter

        14 = BorderCrossingCard

        15 = PilotLicense

        16 = USNaturalizationCertificate

        17 = RefugeeTravelDocument

        18 = GovernmentId

        19 = DriversLicense

        20 = RedressNumber

        21 = KnownTravelerId

        22 = FormOfId

        23 = Nexus

        24 = SecondaryExempt'
      x-enumNames:
      - Unknown
      - AlienRegistrationCard
      - PermanentResidentCard
      - FacilitationDocument
      - InsPass
      - MilitaryId
      - Passport
