          type: array
          items:
            type: object
            required:
              - id
              - direction
              - segments
            properties:
              id:
                type: string
                example: "1"
              direction:
                $ref: "#/components/schemas/DirectionType"
                example: OUTBOUND
              segments:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - departureAirport
                  properties:
                    id:
                      type: string
                      example: "1"
                    departureAirport:
                      type: string
                      example: LGW
