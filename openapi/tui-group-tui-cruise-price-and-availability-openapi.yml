          type: string
          description: Journey start date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "2024-12-25"
        to:
          type: string
          description: Journey end date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "2024-12-25"
