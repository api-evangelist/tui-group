        '400':
          description: There was a problem with the request and it could not be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
              examples:
                No booking in state:
                  description: No booking loaded into state during the retrieval of SSR availability.
                  value:
                    errors:
                    - id: null
                      code: nsk:Booking:NoBookingInState
                      message: nsk:Booking:NoBookingInState
                      type: Validation
                      details: null
                      rawMessage: No booking was found in session, cannot perform operation.
                      exception: null
                      debugMode: The API is currently running in debug mode. In production the 'rawMessage' and 'exception' nodes will not be returned. These are for troubleshooting development issues only.
                    data: null
                Invalid SSR key:
                  description: The specified SSR key is not valid or not found in the booking.
                  value:
                    errors:
                    - id: null
                      code: nsk:Exceptions:InvalidKey
                      message: The identifier 'ssrKey' with value 'MCFNQ0ZCUkZRLSFRV0VSITEhQk9TIU5WITYzOTEwODM2MDAwMDAwMDAwMCFTTEMhNTY2NyE=' is invalid.
                      type: Validation
                      details:
                        ssrKey: MCFNQ0ZCUkZRLSFRV0VSITEhQk9TIU5WITYzOTEwODM2MDAwMDAwMDAwMCFTTEMhNTY2NyE=
                      rawMessage: The identifier 'ssrKey' with value 'MCFNQ0ZCUkZRLSFRV0VSITEhQk9TIU5WITYzOTEwODM2MDAwMDAwMDAwMCFTTEMhNTY2NyE=' is invalid.
                      exception: null
                      debugMode: The API is currently running in debug mode. In production the 'rawMessage' and 'exception' nodes will not be returned. These are for troubleshooting development issues only.
                    data: null
        '409':
          description: Concurrent changes were being made in the same session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
  /api/nsk/v3/booking/ssrs/availability:
    post:
      tags:
      - booking/ssrs
      summary: Gets the available SSRs that can be added to a booking.
      description: 'This endpoint requires a booking in state. By default, all SSR availability for the booking is returned.

        For details about a specific SSR, the `GET booking/passengers/{passengerKey}/ssrs/{ssrCode}/price` endpoint can

        be used.

        Duplicate values for trips and/or passenger keys in the request are ignored i.e. only unique values are

        processed.


        Infant SSR availability for the configured infant SSR (the infant SSR code recognized by the Digital API on

        infant-specific endpoints) is included. To determine the configured infant SSR, please use the

        `GET api/v1/configuration` endpoint.

        Please note that the SSR key for the configured infant SSR will be null as selling and cancelling the infant

        SSR is handled by the following infant-specific endpoints:

        - `POST/DELETE booking/passengers/{passengerKey}/infant`

        - `POST/DELETE booking/journeys/{journeyKey}/passengers/{passengerKey}/infant`

        - `POST/DELETE booking/segments/{segmentKey}/passengers/{passengerKey}/infant`

        - `POST trip/sell`

        - `POST trip`


        GraphQL endpoint: ssrAvailabilityv3'
      operationId: nsk_v3_booking_ssrs_availability_post
      requestBody:
        x-name: request
        description: Optional parameters to filter the SSR availability.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsrAvailabilityRequestv3'
            examples:
              Retrieve SSR availability:
                description: Example request for retrieving SSR availability.
                value:
                  trips:
                  - identifier:
                      identifier: '5600'
                      carrierCode: NV
                      opSuffix: null
                    destination: BOS
                    origin: SLC
                    departureDate: '2026-07-09T00:00:00Z'
                  passengerKeys:
                  - MCFBRFQ-
                  currencyCode: USD
                  feePricingMode: 0
                  ssrAvailabilityMode: 0
              Retrieve SSR availability with multiple trips and passengers:
