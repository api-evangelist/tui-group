openapi: 3.2.0
info:
  title: NewSkies-Digital-Api Booking/ssrs API
  version: 4.8.6.23
  description: Navitaire Digital Api
servers:
- url: https://prod.api.tui/flight/newskies/rest
  description: TUI Prod
- url: https://playground.api.tui/flight/newskies/rest
  description: TUI Playground
security:
- JWT: []
tags:
- name: booking/ssrs
paths:
  /api/nsk/v1/booking/ssrs:
    get:
      tags:
      - booking/ssrs
      summary: Retrieves the current SSRs added to the booking in state.
      description: 'Requires a booking in state.


        GraphQL endpoint: ssrs'
      operationId: nsk_v1_booking_ssrs_get
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponseOfIListOfPassengerSsr'
        '404':
          description: The item was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
  /api/nsk/v3/booking/ssrs:
    post:
      tags:
      - booking/ssrs
      summary: Adds SSRs to the booking in state.
      description: 'Adding an SSR by journey automatically adds the SSR to every segment.

        Requires a booking in state.

        IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.


        GraphQL endpoint: ssrsAddv3'
      operationId: nsk_v3_booking_ssrs_post
      requestBody:
        x-name: request
        description: The SSR by keys request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsrByKeysRequestv2'
        required: true
        x-position: 1
      responses:
        '201':
          description: The item was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '400':
          description: There was a problem with the request and it could not be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '409':
          description: Concurrent changes were being made in the same session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
  /api/nsk/v1/booking/ssrs/{ssrKey}:
    get:
      tags:
      - booking/ssrs
      summary: Retrieves the current SSR by key.
      description: 'Requires a booking in state.


        GraphQL endpoint: ssr'
      operationId: nsk_v1_booking_ssrs_ssrKey_get
      parameters:
      - name: ssrKey
        in: path
        required: true
        description: Unique Ssr passenger identifier.
        schema:
          type: string
        x-position: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponseOfPassengerSsr'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
    put:
      tags:
      - booking/ssrs
      summary: Modifies the SSR note.
      description: 'NOTE: This endpoint takes a singular property for the request body and as such the request will need to be

        formatted differently than what it typically looks like. For more information, please see

        https://navitaire-developer-digital-api.azurewebsites.net/articles/Miscellaneous/UniqueInputSingleRequestBodiesREST

        and the Swagger request examples.

        Requires a booking in state.

        IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.


        GraphQL endpoint: ssrSet'
      operationId: nsk_v1_booking_ssrs_ssrKey_put
      parameters:
      - name: ssrKey
        in: path
        required: true
        description: Unique Ssr key identifier.
        schema:
          type: string
        x-position: 1
      requestBody:
        x-name: note
        description: The updated note.
        content:
          application/json:
            schema:
              type: string
            examples:
              Ssr Note, Json Request Body:
                description: Example request for updating a ssr note.
                value: Adding an ssr note.
        required: true
        x-position: 2
      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '400':
          description: There was a problem with the request and it could not be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '403':
          description: Role permissions are not met.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '409':
          description: Concurrent changes were being made in the same session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
    delete:
      tags:
      - booking/ssrs
      summary: Deletes the SSR associated with the specified passenger SSR key.
      description: 'Requires a booking in state. The passenger SSR key can be found in the `PassengerSegment.Ssrs` object in the

        booking.

        IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.


        GraphQL endpoint: ssrsDelete'
      operationId: nsk_v1_booking_ssrs_ssrKey_delete
      parameters:
      - name: ssrKey
        in: path
        required: true
        description: The passenger SSR key.
        schema:
          type: string
        x-position: 1
      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '400':
          description: There was a problem with the request and it could not be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '409':
          description: Concurrent changes were being made in the same session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
      deprecated: true
  /api/nsk/v3/booking/ssrs/{ssrKey}:
    post:
      tags:
      - booking/ssrs
      summary: Add an SSR to the booking in state.
      description: 'Adding an SSR by journey automatically adds the SSR to every segment.

        Requires a booking in state.

        IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.


        GraphQL endpoint: ssrAddv3'
      operationId: nsk_v3_booking_ssrs_ssrKey_post
      parameters:
      - name: ssrKey
        in: path
        required: true
        description: The SSR key to add.
        schema:
          type: string
        x-position: 1
      requestBody:
        x-name: request
        description: The single SSR by key request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SingleSsrByKeyRequestv2'
        required: true
        x-position: 2
      responses:
        '201':
          description: The item was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
              examples:
                With Already Booked SSR or Bundle:
                  description: Example OSI Message if passenger already booked an SSR or bundle
                  value:
                    messages:
                    - rawValue: '[HMC] cannot be sold because passenger 0 already booked [THCS] on NV3075  YTZ-LAX.'
                      code: CannotSellBundleSSR
                      debugMode: The API is currently running in debug mode. In production the 'rawValue' node will not be returned. These are for troubleshooting development issues only.
                      type: CannotSellBundleSSR
                      value: CannotSellBundleSSR
                      status: 0
                      details:
                        cannotSellBundleSSRMessage: '[HMC] cannot be sold because passenger 0 already booked [THCS] on NV3075  YTZ-LAX.'
                    data: null
                With Cannot Find Interchangeable Bundle SSR:
                  description: Example OSI Message if cannot find interchangeable bundle SSR in state
                  value:
                    messages:
                    - rawValue: Cannot find interchangeable bundle SSR for [HMC] in state.
                      code: CannotSellBundleSSR
                      debugMode: The API is currently running in debug mode. In production the 'rawValue' node will not be returned. These are for troubleshooting development issues only.
                      type: CannotSellBundleSSR
                      value: CannotSellBundleSSR
                      status: 0
                      details:
                        cannotSellBundleSSRMessage: Cannot find interchangeable bundle SSR for [HMC] in state.
                    data: null
                With SSR Not Found in Service Bundle:
                  description: Example OSI Message if an SSR is not found in service bundle
                  value:
                    messages:
                    - rawValue: SSR [HMC] not found in service bundle.
                      code: CannotSellBundleSSR
                      debugMode: The API is currently running in debug mode. In production the 'rawValue' node will not be returned. These are for troubleshooting development issues only.
                      type: CannotSellBundleSSR
                      value: CannotSellBundleSSR
                      status: 0
                      details:
                        cannotSellBundleSSRMessage: SSR [HMC] not found in service bundle.
                    data: null
                With Duplicate SSR or Bundle:
                  description: Example OSI Message if duplicate SSR or Bundle
                  value:
                    messages:
                    - rawValue: Duplicate SSR [THCS] in SAN-YTZ is not allowed for service bundle.
                      code: CannotSellBundleSSR
                      debugMode: The API is currently running in debug mode. In production the 'rawValue' node will not be returned. These are for troubleshooting development issues only.
                      type: CannotSellBundleSSR
                      value: CannotSellBundleSSR
                      status: 0
                      details:
                        cannotSellBundleSSRMessage: Duplicate SSR [THCS] in SAN-YTZ is not allowed for service bundle.
                    data: null
        '400':
          description: There was a problem with the request and it could not be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '409':
          description: Concurrent changes were being made in the same session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
