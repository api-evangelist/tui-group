  /api/nsk/v3/booking/passengers/{passengerKey}:
    put:
      tags:
      - booking/passengers
      summary: Updates a specific passenger on the booking.
      description: '`IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.`


        GraphQL endpoints: passengerSetv4, passengersSetBatchv2'
      operationId: nsk_v3_booking_passengers_passengerKey_put
      parameters:
      - name: passengerKey
        in: path
        required: true
        description: The unique passenger key.
        schema:
          type: string
        x-position: 1
      - name: waiveNameChangeFees
        in: query
        description: Waive the name change fees.
        schema:
          type:
          - boolean
          - 'null'
        x-position: 2
      - name: syncPassengerAndTravelDocGender
        in: query
        description: "Indicates whether to synchronize the passenger and all its travel\ndocuments' gender. This will update the gender of all the travel documents in the\npassengers[passengerKey].travelDocuments list in the booking model. The value defaults to true if not specified.\n            "
        schema:
          type: boolean
          default: true
        x-position: 4
      requestBody:
        x-name: request
        description: The modified passenger request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassengerBase'
        required: true
        x-position: 3
      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
              examples:
                Passenger Updated:
                  description: The passenger has been updated.
                  value:
                    data: null
                Valid declared gender mapped to a different binary gender:
                  description: Example response for successfully updating or modifying a passenger with a valid declared gender mapped to a different binary gender (i.e. Male, Undisclosed or Unspecified to Female).
                  value:
                    messages:
                    - code: SyncBinaryGenderToDeclaredGender
                      type: SyncBinaryGenderToDeclaredGender
                      value: 'Passenger Justine Doe - Binary Gender Male will be synced with Declared Gender value F. New Binary Gender: Female'
                      status: 1
                      details: null
                    data: null
                Mismatching gender and declared gender:
                  description: Example response for successfully updating or modifying a passenger with a mismatching gender (Female) and declared gender (Male).
                  value:
                    messages:
                    - code: SyncBinaryGenderToDeclaredGender
                      type: SyncBinaryGenderToDeclaredGender
                      value: 'Passenger Justine Doe - Binary Gender Female will be synced with Declared Gender value M. New Binary Gender: Male'
                      status: 1
                      details: null
                    data: null
                With mismatching passenger and travel document gender:
                  description: The passenger gender does not match with the travel document, and the `syncPassengerAndTravelDocGender` is set to false.
                  value:
                    messages:
                    - rawValue: Passenger (Doe, John) Gender doesn't match Travel Document (US, P, P123412341234) Gender
                      code: null
                      debugMode: The API is currently running in debug mode. In production the 'rawValue' node will not be returned. These are for troubleshooting development issues only.
                      type: FailedTravelDocValidation
                      value: null
                      status: 0
                      details: null
                    data: null
        '400':
          description: There was a problem with the request and it could not be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
              examples:
                Invalid declared gender length:
                  description: Example response when the declared gender in the request is more than 2 characters.
                  value:
                    errors:
                    - id: null
                      code: PassengerInformation.DeclaredGender:StringLengthAttribute
                      message: The field PassengerInformation must be a string with a maximum length of 2.
                      type: Validation
                      details:
                        member: DeclaredGender
                        model: PassengerInformation
                        validation: StringLengthAttribute
                      rawMessage: The field PassengerInformation must be a string with a maximum length of 2.
                      exception: null
                      debugMode: The API is currently running in debug mode. In production the 'rawMessage' and 'exception' nodes will not be returned. These are for troubleshooting development issues only.
                    data: null
                Inactive or non-existent declared gender:
                  description: Example response when the declared gender in the request is inactive or non-existent.
                  value:
                    errors:
                    - id: null
                      code: nsk-server:InvalidDeclaredGender
                      message: Passenger John Doe has an invalid Declared Gender K.
                      type: Validation
                      details:
                        message: Passenger John Doe has an invalid Declared Gender K.
                      rawMessage: Passenger John Doe has an invalid Declared Gender K.
                      exception: null
                      debugMode: The API is currently running in debug mode. In production the 'rawMessage' and 'exception' nodes will not be returned. These are for troubleshooting development issues only.
                    data: null
        '403':
          description: Role permissions are not met.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '409':
          description: Concurrent changes were being made in the same session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
        '500':
          description: A server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponse'
    patch:
      tags:
      - booking/passengers
      summary: Patches a specific passenger on the booking.
      description: 'Please note, the API will perform validation for the same properties that are on both the PATCH request and the

        existing passenger.

        IMPORTANT: This endpoint should NOT be called concurrently using the same session token to avoid performance

        problems.


        GraphQL endpoints: passengerModifyv4, passengersModifyBatchv2'
      operationId: nsk_v3_booking_passengers_passengerKey_patch
      parameters:
      - name: passengerKey
        in: path
        required: true
        description: The unique passenger key.
        schema:
          type: string
        x-position: 1
      - name: waiveNameChangeFees
        in: query
        description: Waive the name change fee. If unprovided, defaults to the configuration value.
        schema:
          type:
          - boolean
          - 'null'
        x-position: 2
      - name: syncPassengerAndTravelDocGender
        in: query
        description: "Indicates whether to synchronize the passenger and all its travel\ndocuments' gender. This will update the gender of all the travel documents in the\npassengers[passengerKey].travelDocuments list in the booking model. The value defaults to true if not specified.\n            "
        schema:
          type: boolean
          default: true
        x-position: 4
      requestBody:
        x-name: request
        description: The patched passenger request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeltaMapperOfPassengerBase'
        required: true
        x-position: 3
      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
