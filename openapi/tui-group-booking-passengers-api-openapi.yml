      responses:
        '200':
          description: OK. Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IJsonResponseOfIDictionaryOfStringAndPassengerTypePriceBreakdown'
        '404':
          description: The item was not found.
          content:
