generated: '2026-07-28'
method: searched
source: >-
  npm registry search and package metadata (registry.npmjs.org), PyPI, Maven Central, NuGet,
  Packagist, RubyGems, pkg.go.dev, plus every documentation page on https://developer.tui and the
  GitHub organisation https://github.com/tuigroup. Probed 2026-07-28.
description: >-
  TUI Group ships NO client libraries for its APIs. Across 21 published API products and 1,261
  operations there is not a single first-party SDK in any language, and no SDK, client-library or
  code-generation page exists anywhere on developer.tui — the portal's only integration aids are
  three downloadable Postman collections and a hand-written code-examples tab on one product. What
  TUI does publish on a public registry is a design system: three first-party npm packages under the
  @tui scope, maintained from TUI's own GitLab (ssh.source.tui) by TUI-badged maintainers. Those are
  front-end packages for TUI's consumer websites, not API clients, so they are recorded here as
  official packages but they deliberately do NOT earn an SDKs pointer — see sdk_assessment below.
sdk_assessment:
  api_client_sdks: 0
  languages: []
  finding: >-
    No API client SDK exists in any registry or repository. A partner integrating TUI writes raw
    HTTP against the OAuth 2.0 gateway, raw XML against the ANVR G7 channel, or generates a client
    itself from the OpenAPI documents harvested to openapi/ in this repo.
  note: >-
    The three @tui packages below are a CSS/web-component design system, not API clients. Emitting
    an SDKs pointer for them would misrepresent TUI's developer experience, so apis.yml carries a
    Packages pointer and a Components pointer but no SDKs pointer.
