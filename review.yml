aid: tui-group
name: TUI Group
review:
  question: >-
    Does TUI Group publish a real, reachable developer/API surface, and what would it cost a
    partner integrated with that surface to leave?
  answer: true
  date: '2026-07-28'
  reviewer: API Evangelist
  tier: ota-metasearch
  homeMarket: United Kingdom
  domicileNote: >-
    The brief assigns United Kingdom as the home market. That is accurate as the group's largest
    single source market — TUI UK & Ireland, the UK-registered carrier TUI Airways and Marella
    Cruises are the group's biggest operating units — but the parent, TUI AG, is domiciled in
    Hannover, Germany and has been listed on the Frankfurt MDAX since it ended its London primary
    listing in 2023. Recorded here so the UK framing is not mistaken for a legal domicile claim.
findings:
  summary: |
    TUI Group publishes a genuine, publicly readable developer portal at https://developer.tui
    (a Drupal 10 / Pronovix portal fronting an Apigee X gateway on the *.api.tui brand TLD). It
    lists 21 API products across flights, packages, accommodation content, cruise and metasearch
    distribution. The documentation is unusually open for a tour operator: base URLs, endpoint
    tables, request and response bodies, auth flows, error catalogues, quota tiers and two
    downloadable Postman collections are all readable without a login. The runtime is not open.
    Every API product requires partner-manager approval, most flight APIs additionally require a
    Navitaire New Skies agent profile, a written workflow validation and a production IP whitelist,
    and the TUI fly OTA API states that step one is to conclude a contract. No OpenAPI, AsyncAPI or
    other machine-readable API description is published anywhere on the portal.
